<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">38加47的进位</title><desc id="desc">换前7个十和15个一，换后8个十和5个一，两边都是85。</desc><rect width="900" height="480" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="42" font-size="28" fill="#203849" text-anchor="start">38＋47：把十个一换成一个十</text><text x="30" y="77" font-size="20" fill="#203849" text-anchor="start">绿色小块表示一个十，橙色圆点表示一个一。</text><rect x="25" y="105" width="385" height="260" rx="8" fill="#ffffff" stroke="#9aadb6" stroke-width="2"/><text x="43" y="140" font-size="23" fill="#203849" text-anchor="start">换之前：7 个十、15 个一</text><rect x="45" y="160" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="77.5" y="188" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="130" y="160" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="162.5" y="188" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="215" y="160" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="247.5" y="188" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="300" y="160" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="332.5" y="188" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="45" y="215" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="77.5" y="243" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="130" y="215" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="162.5" y="243" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="215" y="215" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="247.5" y="243" font-size="20" fill="#203849" text-anchor="middle">10</text><circle cx="55" cy="300" r="9" fill="#dc732d"/><circle cx="87" cy="300" r="9" fill="#dc732d"/><circle cx="119" cy="300" r="9" fill="#dc732d"/><circle cx="151" cy="300" r="9" fill="#dc732d"/><circle cx="183" cy="300" r="9" fill="#dc732d"/><circle cx="215" cy="300" r="9" fill="#dc732d"/><circle cx="247" cy="300" r="9" fill="#dc732d"/><circle cx="279" cy="300" r="9" fill="#dc732d"/><circle cx="311" cy="300" r="9" fill="#dc732d"/><circle cx="343" cy="300" r="9" fill="#dc732d"/><circle cx="55" cy="334" r="9" fill="#dc732d"/><circle cx="87" cy="334" r="9" fill="#dc732d"/><circle cx="119" cy="334" r="9" fill="#dc732d"/><circle cx="151" cy="334" r="9" fill="#dc732d"/><circle cx="183" cy="334" r="9" fill="#dc732d"/><rect x="490" y="105" width="385" height="260" rx="8" fill="#ffffff" stroke="#9aadb6" stroke-width="2"/><text x="508" y="140" font-size="23" fill="#203849" text-anchor="start">换之后：8 个十、5 个一</text><rect x="510" y="160" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="542.5" y="188" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="595" y="160" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="627.5" y="188" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="680" y="160" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="712.5" y="188" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="765" y="160" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="797.5" y="188" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="510" y="215" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="542.5" y="243" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="595" y="215" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="627.5" y="243" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="680" y="215" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="712.5" y="243" font-size="20" fill="#203849" text-anchor="middle">10</text><rect x="765" y="215" width="65" height="40" rx="5" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="797.5" y="243" font-size="20" fill="#203849" text-anchor="middle">10</text><circle cx="520" cy="300" r="9" fill="#dc732d"/><circle cx="552" cy="300" r="9" fill="#dc732d"/><circle cx="584" cy="300" r="9" fill="#dc732d"/><circle cx="616" cy="300" r="9" fill="#dc732d"/><circle cx="648" cy="300" r="9" fill="#dc732d"/><text x="450" y="230" font-size="40" fill="#203849" text-anchor="middle">→</text><text x="30" y="405" font-size="24" fill="#203849" text-anchor="start">70＋15＝85</text><text x="500" y="405" font-size="24" fill="#203849" text-anchor="start">80＋5＝85</text><text x="30" y="449" font-size="24" fill="#203849" text-anchor="start">总数没变。个位写 5，向十位进的 1 表示一个十。</text></g></svg>
