<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img"><title>停车费：先找时间落在哪一段</title><rect width="760" height="350" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">停车费：先找时间落在哪一段</text><line x1="80" y1="150" x2="80" y2="167" stroke="#273447" stroke-width="2"/><text x="80" y="200" font-size="20" fill="#273447" text-anchor="middle">0 时</text><line x1="200" y1="150" x2="200" y2="167" stroke="#273447" stroke-width="2"/><text x="200" y="200" font-size="20" fill="#273447" text-anchor="middle">1 时</text><line x1="320" y1="150" x2="320" y2="167" stroke="#273447" stroke-width="2"/><text x="320" y="200" font-size="20" fill="#273447" text-anchor="middle">2 时</text><line x1="440" y1="150" x2="440" y2="167" stroke="#273447" stroke-width="2"/><text x="440" y="200" font-size="20" fill="#273447" text-anchor="middle">3 时</text><line x1="560" y1="150" x2="560" y2="167" stroke="#273447" stroke-width="2"/><text x="560" y="200" font-size="20" fill="#273447" text-anchor="middle">4 时</text><line x1="680" y1="150" x2="680" y2="167" stroke="#273447" stroke-width="2"/><text x="680" y="200" font-size="20" fill="#273447" text-anchor="middle">5 时</text><line x1="80" y1="150" x2="680" y2="150" stroke="#273447" stroke-width="2"/><line x1="80" y1="140" x2="320" y2="140" stroke="#2454b8" stroke-width="9"/><line x1="323" y1="140" x2="437" y2="140" stroke="#c45a23" stroke-width="9"/><line x1="443" y1="140" x2="557" y2="140" stroke="#c45a23" stroke-width="9"/><line x1="563" y1="140" x2="677" y2="140" stroke="#c45a23" stroke-width="9"/><text x="200" y="110" font-size="21" fill="#2454b8" text-anchor="middle">前 2 小时：5 元</text><text x="380" y="110" font-size="20" fill="#c45a23" text-anchor="middle">+3 元</text><text x="500" y="110" font-size="20" fill="#c45a23" text-anchor="middle">+3 元</text><text x="620" y="110" font-size="20" fill="#c45a23" text-anchor="middle">+3 元</text><text x="65" y="263" font-size="23" fill="#273447" text-anchor="start">恰好 4 小时：5 + 2 × 3 = 11 元</text><text x="65" y="310" font-size="23" fill="#273447" text-anchor="start">4 小时 10 分：5 + 3 × 3 = 14 元</text></g></svg>