<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img"><title>圆心、半径和直径</title><rect width="760" height="390" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="28" y="40" font-size="25" fill="#273447" text-anchor="start">半径从圆心到圆上；直径经过圆心</text><circle cx="215" cy="215" r="105" fill="#e4f2f5" stroke="#287b98" stroke-width="3"/><path d="M110 215 H320" stroke="#b27b28" stroke-width="4"/><path d="M215 215 V110" stroke="#bd5b43" stroke-width="4"/><circle cx="215" cy="215" r="5" fill="#273447"/><text x="197" y="245" font-size="22" fill="#273447" text-anchor="start">O</text><text x="228" y="160" font-size="21" fill="#bd5b43" text-anchor="start">半径 r</text><text x="165" y="350" font-size="22" fill="#9a651e" text-anchor="start">直径 d</text><text x="435" y="140" font-size="23" fill="#273447" text-anchor="start">O 是圆心</text><text x="435" y="190" font-size="23" fill="#273447" text-anchor="start">每条半径都一样长</text><text x="435" y="240" font-size="23" fill="#273447" text-anchor="start">一条直径由两条半径接成</text><text x="435" y="295" font-size="28" fill="#216c88" text-anchor="start">d = 2r</text></g></svg>
