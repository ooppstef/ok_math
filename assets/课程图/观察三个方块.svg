<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img"><title>三个方块：先看清观察方向</title><rect width="760" height="430" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">三个方块：先看清观察方向</text><text x="60" y="85" font-size="20" fill="#273447" text-anchor="start">摆放位置（每处一层）</text><rect x="110" y="120" width="60" height="60" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><rect x="110" y="180" width="60" height="60" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><rect x="170" y="180" width="60" height="60" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="65" y="155" font-size="18" fill="#273447" text-anchor="start">后</text><text x="65" y="215" font-size="18" fill="#273447" text-anchor="start">前</text><text x="125" y="266" font-size="18" fill="#273447" text-anchor="start">左</text><text x="215" y="266" font-size="18" fill="#273447" text-anchor="start">右</text><line x1="165" y1="320" x2="165" y2="250" stroke="#2454b8" stroke-width="3"/><polygon points="165,250 169.78462087522354,259.9049181258794 160.21537912477646,259.9049181258794" fill="#2454b8" stroke="#2454b8" stroke-width="2"/><text x="110" y="350" font-size="18" fill="#273447" text-anchor="start">正面观察</text><rect x="355" y="125" width="50" height="50" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><rect x="405" y="125" width="50" height="50" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="355" y="207" font-size="20" fill="#273447" text-anchor="start">正面：两格</text><rect x="555" y="125" width="50" height="50" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><rect x="605" y="125" width="50" height="50" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="540" y="207" font-size="20" fill="#273447" text-anchor="start">左面：前 → 后</text><text x="320" y="285" font-size="21" fill="#273447" text-anchor="start">从上面看：三个位置都能看见</text><text x="320" y="325" font-size="21" fill="#273447" text-anchor="start">从正面看：后左被前左挡住</text><text x="320" y="365" font-size="20" fill="#273447" text-anchor="start">图上看见的格数，不一定是总数</text></g></svg>