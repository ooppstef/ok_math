<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d"><title id="t">每支五元，总价与支数成正比例</title><desc id="d">横轴为支数每格一支，纵轴为总价每格五元，标出零零、一五、二十、三十五、四二十共五点；虚线只辅助观察各点共线。</desc><rect width="760" height="400" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203849"><text x="30" y="35" font-size="24">先看刻度，再找每一对数据的位置</text><g stroke="#d2dce0" stroke-width="1"><path d="M120 80 H520 M120 140 H520 M120 200 H520 M120 260 H520 M220 80 V320 M320 80 V320 M420 80 V320 M520 80 V320"/></g><path d="M120 65 V320 H550" fill="none" stroke="#203849" stroke-width="2"/><path d="M120 320 L520 80" stroke="#8caab9" stroke-width="2" stroke-dasharray="7 6"/><g font-size="20" text-anchor="middle"><text x="120" y="346">0</text><text x="220" y="346">1</text><text x="320" y="346">2</text><text x="420" y="346">3</text><text x="520" y="346">4</text></g><g font-size="20" text-anchor="end"><text x="105" y="267">5</text><text x="105" y="207">10</text><text x="105" y="147">15</text><text x="105" y="87">20</text></g><g fill="#2476a8"><circle cx="120" cy="320" r="6"/><circle cx="220" cy="260" r="6"/><circle cx="320" cy="200" r="6"/><circle cx="420" cy="140" r="6"/><circle cx="520" cy="80" r="6"/></g><text x="567" y="327" font-size="21">数量/支</text><text x="45" y="60" font-size="20">总价/元</text><text x="30" y="382" font-size="19" fill="#526171">整支笔对应图中的点；虚线用于看出这些点在同一直线上。</text></g></svg>
