<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img"><title>去年四十人今年五十人，相差十人的两个比较整体</title><rect width="760" height="450" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="28" y="40" font-size="25" fill="#273447" text-anchor="start">相差都是 10 人，和谁比却不同</text><text x="40" y="138" font-size="22" fill="#273447" text-anchor="start">去年</text><text x="40" y="258" font-size="22" fill="#273447" text-anchor="start">今年</text><rect x="130" y="108" width="320" height="46" fill="#75b8d0" stroke="#287b98"/><rect x="130" y="228" width="320" height="46" fill="#75b8d0" stroke="#287b98"/><rect x="450" y="228" width="80" height="46" fill="#e49b39" stroke="#ad5e17"/><path d="M450 165 V210 M530 165 V210 M450 182 H530" fill="none" stroke="#ad5e17" stroke-width="2"/><text x="280" y="139" font-size="23" fill="#273447" text-anchor="middle">40 人</text><text x="280" y="259" font-size="23" fill="#273447" text-anchor="middle">40 人</text><text x="490" y="259" font-size="22" fill="#273447" text-anchor="middle">10</text><text x="560" y="259" font-size="23" fill="#273447" text-anchor="start">共 50 人</text><text x="490" y="176" font-size="20" fill="#9a5417" text-anchor="middle">差 10 人</text><text x="130" y="330" font-size="25" fill="#273447" text-anchor="start">今年比去年多：10 ÷ 40 = 25%</text><text x="130" y="380" font-size="25" fill="#273447" text-anchor="start">去年比今年少：10 ÷ 50 = 20%</text><text x="130" y="422" font-size="20" fill="#273447" text-anchor="start">图中每 1 人对应相同的长度。</text></g></svg>
