<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img"><title>沿着相接的边折起来</title><rect width="760" height="420" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">沿着相接的边折起来</text><rect x="100" y="90" width="82" height="82" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="141" y="141" font-size="28" fill="#273447" text-anchor="middle">A</text><rect x="100" y="172" width="82" height="82" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="141" y="223" font-size="28" fill="#273447" text-anchor="middle">B</text><rect x="182" y="172" width="82" height="82" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="223" y="223" font-size="28" fill="#273447" text-anchor="middle">C</text><rect x="264" y="172" width="82" height="82" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="305" y="223" font-size="28" fill="#273447" text-anchor="middle">D</text><rect x="346" y="172" width="82" height="82" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="387" y="223" font-size="28" fill="#273447" text-anchor="middle">E</text><rect x="182" y="254" width="82" height="82" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="223" y="305" font-size="28" fill="#273447" text-anchor="middle">F</text><text x="470" y="150" font-size="23" fill="#273447" text-anchor="start">相对的面</text><text x="495" y="200" font-size="25" fill="#273447" text-anchor="start">A ↔ F</text><text x="495" y="248" font-size="25" fill="#273447" text-anchor="start">B ↔ D</text><text x="495" y="296" font-size="25" fill="#273447" text-anchor="start">C ↔ E</text><text x="100" y="385" font-size="21" fill="#273447" text-anchor="start">六个面不重叠，也不留下缺口，才能围成正方体。</text></g></svg>