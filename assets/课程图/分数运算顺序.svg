<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>括号改变了先算的部分</title><rect width="760" height="360" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">括号改变了先算的部分</text><text x="65" y="110" font-size="32">3/4 − <tspan fill="#2454b8" text-decoration="underline">1/2 × 2/3</tspan></text><text x="430" y="110" font-size="21" fill="#273447" text-anchor="start">先乘：1/2 × 2/3 = 1/3</text><text x="65" y="170" font-size="27" fill="#273447" text-anchor="start">= 3/4 − 1/3 = 5/12</text><text x="65" y="245" font-size="32"><tspan fill="#c45a23" text-decoration="underline">(3/4 − 1/2)</tspan> × 2/3</text><text x="430" y="245" font-size="21" fill="#273447" text-anchor="start">先减：3/4 − 1/2 = 1/4</text><text x="65" y="310" font-size="27" fill="#273447" text-anchor="start">= 1/4 × 2/3 = 1/6</text></g></svg>