<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img"><title>8 × 5 × 3 厘米盒子的展开图</title><rect width="760" height="460" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">8 × 5 × 3 厘米盒子的展开图</text><rect x="220" y="240" width="136" height="85" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="288.0" y="289.5" font-size="18" fill="#273447" text-anchor="middle">底 8×5</text><rect x="220" y="189" width="136" height="51" fill="#fff0d9" stroke="#2454b8" stroke-width="2"/><text x="288.0" y="221.5" font-size="18" fill="#273447" text-anchor="middle">8×3</text><rect x="220" y="325" width="136" height="51" fill="#fff0d9" stroke="#2454b8" stroke-width="2"/><text x="288.0" y="357.5" font-size="18" fill="#273447" text-anchor="middle">8×3</text><rect x="169" y="240" width="51" height="85" fill="#fff0d9" stroke="#2454b8" stroke-width="2"/><text x="194.5" y="289.5" font-size="18" fill="#273447" text-anchor="middle">5×3</text><rect x="356" y="240" width="51" height="85" fill="#fff0d9" stroke="#2454b8" stroke-width="2"/><text x="381.5" y="289.5" font-size="18" fill="#273447" text-anchor="middle">5×3</text><rect x="220" y="104" width="136" height="85" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="288.0" y="153.5" font-size="18" fill="#273447" text-anchor="middle">盖 8×5</text><text x="470" y="180" font-size="21" fill="#273447" text-anchor="start">底面、上盖各 40 cm²</text><text x="470" y="228" font-size="21" fill="#273447" text-anchor="start">两个侧面各 24 cm²</text><text x="470" y="276" font-size="21" fill="#273447" text-anchor="start">另两个各 15 cm²</text><text x="470" y="324" font-size="21" fill="#273447" text-anchor="start">无盖时去掉上盖</text><text x="120" y="435" font-size="20" fill="#273447" text-anchor="start">图中未画粘贴边。单位：厘米。</text></g></svg>