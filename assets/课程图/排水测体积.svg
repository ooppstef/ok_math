<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img"><title>水面升高的体积 = 石头排开的水的体积</title><rect width="760" height="420" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">水面升高的体积 = 石头排开的水的体积</text><rect x="90" y="90" width="230" height="230" fill="white" stroke="#667085" stroke-width="2"/><rect x="90" y="195" width="230" height="125" fill="#dceeff" stroke="#2454b8" stroke-width="2"/><text x="205" y="352" font-size="22" fill="#273447" text-anchor="middle">放入前</text><text x="205" y="182" font-size="21" fill="#273447" text-anchor="middle">水深 5 厘米</text><rect x="410" y="90" width="230" height="230" fill="white" stroke="#667085" stroke-width="2"/><rect x="410" y="145" width="230" height="175" fill="#dceeff" stroke="#2454b8" stroke-width="2"/><polygon points="475,295 465,245 515,210 565,240 575,300" fill="#9ba6ad" stroke="#667085" stroke-width="2"/><text x="525" y="352" font-size="22" fill="#273447" text-anchor="middle">完全浸没后</text><text x="525" y="132" font-size="21" fill="#273447" text-anchor="middle">水深 7 厘米</text><text x="70" y="392" font-size="21" fill="#273447" text-anchor="start">底面 10 × 8 厘米；升高 2 厘米 → 10 × 8 × 2 = 160 cm³</text></g></svg>