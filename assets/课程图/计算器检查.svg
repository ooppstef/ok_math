<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img"><title>计算器算完，还要看看合不合理</title><rect width="760" height="350" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">计算器算完，还要看看合不合理</text><rect x="65" y="85" width="285" height="115" fill="#e7eee4" stroke="#667085" stroke-width="2"/><text x="85" y="125" font-size="26" fill="#273447" text-anchor="start">398 × 21</text><text x="325" y="175" font-size="36" fill="#273447" text-anchor="end">8358</text><text x="395" y="125" font-size="21" fill="#273447" text-anchor="start">先估：398 × 21 ≈ 8000</text><text x="395" y="180" font-size="21" fill="#273447" text-anchor="start">再查：398 × 20 + 398</text><text x="395" y="220" font-size="21" fill="#273447" text-anchor="start">= 7960 + 398 = 8358</text><text x="65" y="290" font-size="22" fill="#273447" text-anchor="start">如果显示 83580，回头检查是不是多按了一个 0。</text></g></svg>