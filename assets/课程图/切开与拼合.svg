<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img"><title>切一刀，新露出两个 4 × 3 的面</title><rect width="760" height="410" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">切一刀，新露出两个 4 × 3 的面</text><rect x="65" y="180" width="240" height="90" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><polygon points="65,180 110,135 350,135 305,180" fill="#ecf2ff" stroke="#2454b8" stroke-width="2"/><polygon points="305,180 350,135 350,225 305,270" fill="#b9cef5" stroke="#2454b8" stroke-width="2"/><line x1="185" y1="180" x2="230" y2="135" stroke="#c45a23" stroke-width="3" stroke-dasharray="7 5"/><line x1="185" y1="180" x2="185" y2="270" stroke="#c45a23" stroke-width="3" stroke-dasharray="7 5"/><text x="145" y="310" font-size="21" fill="#273447" text-anchor="start">长 8</text><text x="45" y="230" font-size="18" fill="#273447" text-anchor="start">高 3</text><text x="305" y="160" font-size="18" fill="#273447" text-anchor="start">宽 4</text><line x1="345" y1="220" x2="400" y2="220" stroke="#2454b8" stroke-width="3"/><polygon points="400,220 390.0950818741206,224.78462087522354 390.0950818741206,215.21537912477646" fill="#2454b8" stroke="#2454b8" stroke-width="2"/><rect x="435" y="180" width="120" height="90" fill="#fff0d9" stroke="#c45a23" stroke-width="2"/><text x="495" y="235" font-size="23" fill="#273447" text-anchor="middle">4 × 3</text><rect x="600" y="180" width="120" height="90" fill="#fff0d9" stroke="#c45a23" stroke-width="2"/><text x="660" y="235" font-size="23" fill="#273447" text-anchor="middle">4 × 3</text><text x="425" y="320" font-size="21" fill="#273447" text-anchor="start">新切面的正视图（各一个）</text><text x="80" y="380" font-size="23" fill="#273447" text-anchor="start">体积不变；表面积增加 2 × 4 × 3 = 24 平方厘米。</text></g></svg>