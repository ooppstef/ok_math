<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img"><title>每本 18 元，4 本一共 72 元</title><rect width="760" height="340" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">每本 18 元，4 本一共 72 元</text><rect x="70" y="100" width="120" height="110" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="130" y="160" font-size="24" fill="#273447" text-anchor="middle">18 元</text><rect x="230" y="100" width="120" height="110" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="290" y="160" font-size="24" fill="#273447" text-anchor="middle">18 元</text><rect x="390" y="100" width="120" height="110" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="450" y="160" font-size="24" fill="#273447" text-anchor="middle">18 元</text><rect x="550" y="100" width="120" height="110" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="610" y="160" font-size="24" fill="#273447" text-anchor="middle">18 元</text><text x="65" y="268" font-size="25" fill="#273447" text-anchor="start">单价 × 数量 = 总价　　18 × 4 = 72</text><text x="65" y="310" font-size="21" fill="#273447" text-anchor="start">72 ÷ 4 = 18（元）　　72 ÷ 18 = 4（本）</text></g></svg>