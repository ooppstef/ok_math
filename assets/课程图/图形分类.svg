<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img"><title>一个图形可以同时有几个名字</title><rect width="760" height="410" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">一个图形可以同时有几个名字</text><rect x="50" y="90" width="390" height="260" fill="#eef2f7" stroke="#667085" stroke-width="2"/><text x="70" y="125" font-size="23" fill="#273447" text-anchor="start">平行四边形</text><rect x="95" y="150" width="300" height="180" fill="#e2ebfc" stroke="#2454b8" stroke-width="2"/><text x="115" y="185" font-size="23" fill="#273447" text-anchor="start">长方形</text><rect x="180" y="200" width="120" height="120" fill="#c4d7ff" stroke="#2454b8" stroke-width="2"/><text x="200" y="265" font-size="23" fill="#273447" text-anchor="start">正方形</text><polygon points="520,110 520,290 700,290" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><line x1="520" y1="270" x2="540" y2="270" stroke="#273447" stroke-width="2"/><line x1="540" y1="270" x2="540" y2="290" stroke="#273447" stroke-width="2"/><text x="550" y="150" font-size="21" fill="#273447" text-anchor="start">45°</text><text x="645" y="275" font-size="21" fill="#273447" text-anchor="start">45°</text><text x="485" y="345" font-size="21" fill="#273447" text-anchor="start">既是直角三角形</text><text x="485" y="378" font-size="21" fill="#273447" text-anchor="start">也是等腰三角形</text></g></svg>