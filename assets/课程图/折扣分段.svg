<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" role="img"><title>七五折现价占原价百分之七十五，省下百分之二十五</title><rect width="700" height="310" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="28" y="40" font-size="25" fill="#273447" text-anchor="start">原价 320 元，打七五折</text><text x="350" y="95" font-size="23" fill="#273447" text-anchor="middle">原价：整条 320 元</text><rect x="70" y="118" width="420" height="70" fill="#75b8d0" stroke="#287b98" stroke-width="2"/><rect x="490" y="118" width="140" height="70" fill="#f1d5ac" stroke="#ad5e17" stroke-width="2"/><text x="280" y="160" font-size="24" fill="#273447" text-anchor="middle">现价 240 元</text><text x="560" y="147" font-size="20" fill="#273447" text-anchor="middle">便宜</text><text x="560" y="174" font-size="22" fill="#273447" text-anchor="middle">80 元</text><text x="280" y="222" font-size="23" fill="#216c88" text-anchor="middle">原价的 75%</text><text x="560" y="222" font-size="23" fill="#9a5417" text-anchor="middle">原价的 25%</text><text x="70" y="278" font-size="24" fill="#273447" text-anchor="start">320 × 75% = 240；320 − 240 = 80</text></g></svg>
