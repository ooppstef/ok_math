<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>先求实际路程，再求时间</title><rect width="760" height="360" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">先求实际路程，再求时间</text><circle cx="100" cy="155" r="8" fill="#2454b8"/><circle cx="640" cy="155" r="8" fill="#2454b8"/><line x1="100" y1="155" x2="640" y2="155" stroke="#2454b8" stroke-width="4"/><text x="100" y="195" font-size="22" fill="#273447" text-anchor="middle">学校</text><text x="640" y="195" font-size="22" fill="#273447" text-anchor="middle">公园</text><text x="370" y="125" font-size="25" fill="#273447" text-anchor="middle">图上路线长 6 厘米</text><text x="80" y="255" font-size="22" fill="#273447" text-anchor="start">比例尺 1∶50000 → 实际 300000 厘米 = 3 千米</text><text x="80" y="310" font-size="25" fill="#273447" text-anchor="start">3 ÷ 4 = 0.75 小时 = 45 分钟</text></g></svg>