<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" role="img" aria-labelledby="title desc"><title id="title">十二颗的两种分法</title><desc id="desc">上面3组每组4颗，下面4组每组3颗；每幅12颗，答案分别是4颗与4袋。</desc><rect width="900" height="495" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="42" font-size="28" fill="#203849" text-anchor="start">同样是 12÷3，问的是什么？</text><text x="30" y="82" font-size="24" fill="#203849" text-anchor="start">A：平均分给 3 个人，求每人几颗。</text><rect x="35" y="105" width="250" height="115" rx="8" fill="#ffffff" stroke="#9aadb6" stroke-width="2"/><circle cx="90" cy="140" r="9" fill="#dc732d"/><circle cx="185" cy="140" r="9" fill="#dc732d"/><circle cx="90" cy="180" r="9" fill="#dc732d"/><circle cx="185" cy="180" r="9" fill="#dc732d"/><text x="160" y="250" font-size="22" fill="#203849" text-anchor="middle">每人 4 颗</text><rect x="315" y="105" width="250" height="115" rx="8" fill="#ffffff" stroke="#9aadb6" stroke-width="2"/><circle cx="370" cy="140" r="9" fill="#dc732d"/><circle cx="465" cy="140" r="9" fill="#dc732d"/><circle cx="370" cy="180" r="9" fill="#dc732d"/><circle cx="465" cy="180" r="9" fill="#dc732d"/><text x="440" y="250" font-size="22" fill="#203849" text-anchor="middle">每人 4 颗</text><rect x="595" y="105" width="250" height="115" rx="8" fill="#ffffff" stroke="#9aadb6" stroke-width="2"/><circle cx="650" cy="140" r="9" fill="#dc732d"/><circle cx="745" cy="140" r="9" fill="#dc732d"/><circle cx="650" cy="180" r="9" fill="#dc732d"/><circle cx="745" cy="180" r="9" fill="#dc732d"/><text x="720" y="250" font-size="22" fill="#203849" text-anchor="middle">每人 4 颗</text><text x="30" y="296" font-size="24" fill="#203849" text-anchor="start">B：每 3 颗装一袋，求能装几袋。</text><rect x="35" y="320" width="190" height="100" rx="8" fill="#ffffff" stroke="#9aadb6" stroke-width="2"/><circle cx="80" cy="368" r="9" fill="#dc732d"/><circle cx="130" cy="368" r="9" fill="#dc732d"/><circle cx="180" cy="368" r="9" fill="#dc732d"/><rect x="250" y="320" width="190" height="100" rx="8" fill="#ffffff" stroke="#9aadb6" stroke-width="2"/><circle cx="295" cy="368" r="9" fill="#dc732d"/><circle cx="345" cy="368" r="9" fill="#dc732d"/><circle cx="395" cy="368" r="9" fill="#dc732d"/><rect x="465" y="320" width="190" height="100" rx="8" fill="#ffffff" stroke="#9aadb6" stroke-width="2"/><circle cx="510" cy="368" r="9" fill="#dc732d"/><circle cx="560" cy="368" r="9" fill="#dc732d"/><circle cx="610" cy="368" r="9" fill="#dc732d"/><rect x="680" y="320" width="190" height="100" rx="8" fill="#ffffff" stroke="#9aadb6" stroke-width="2"/><circle cx="725" cy="368" r="9" fill="#dc732d"/><circle cx="775" cy="368" r="9" fill="#dc732d"/><circle cx="825" cy="368" r="9" fill="#dc732d"/><text x="30" y="462" font-size="23" fill="#203849" text-anchor="start">共 4 袋。上图的 3 是人数，下图的 3 是每袋颗数。</text></g></svg>
