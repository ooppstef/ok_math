<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="t d"><title id="t">线段比例尺</title><desc id="d">一条线分成两个相同小段，三个刻度依次标0、1、2千米，所以每小段代表实际1千米。</desc><rect width="760" height="230" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203849"><text x="30" y="38" font-size="25">每一小段代表实际 1 千米</text><path d="M140 115 H580 M140 103 V127 M360 103 V127 M580 103 V127" fill="none" stroke="#2476a8" stroke-width="4"/><g font-size="23" text-anchor="middle"><text x="140" y="88">0</text><text x="360" y="88">1</text><text x="580" y="88">2 千米</text></g><text x="30" y="192" font-size="19" fill="#526171">网页显示大小会变；比较小段的份数，不用屏幕厘米代替纸上厘米。</text></g></svg>
