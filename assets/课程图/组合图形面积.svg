<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"><title>补齐再减：L 形地垫的面积</title><rect width="760" height="400" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">补齐再减：L 形地垫的面积</text><polygon points="110,90 310,90 310,170 430,170 430,330 110,330" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><rect x="310" y="90" width="120" height="80" fill="#fff0d9" stroke="#c45a23" stroke-width="2"/><line x1="110" y1="170" x2="310" y2="170" stroke="#2454b8" stroke-width="2" stroke-dasharray="7 5"/><text x="270" y="368" font-size="23" fill="#273447" text-anchor="start">8 米</text><text x="35" y="220" font-size="23" fill="#273447" text-anchor="start">6 米</text><text x="345" y="80" font-size="21" fill="#c45a23" text-anchor="start">3 米</text><text x="445" y="140" font-size="21" fill="#c45a23" text-anchor="start">2 米</text><text x="510" y="220" font-size="23" fill="#273447" text-anchor="start">8 × 6 − 3 × 2</text><text x="510" y="262" font-size="23" fill="#273447" text-anchor="start">= 42 平方米</text></g></svg>