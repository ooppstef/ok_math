<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img"><title>第二次按 120 升算，不能把两个 20% 抵消</title><rect width="760" height="390" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">第二次按 120 升算，不能把两个 20% 抵消</text><rect x="85" y="155.0" width="115" height="160.0" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="142" y="140.0" font-size="25" fill="#273447" text-anchor="middle">100 升</text><text x="142" y="350" font-size="20" fill="#273447" text-anchor="middle">原来</text><rect x="315" y="123.0" width="115" height="192.0" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="372" y="108.0" font-size="25" fill="#273447" text-anchor="middle">120 升</text><text x="372" y="350" font-size="20" fill="#273447" text-anchor="middle">增加 20% 后</text><rect x="545" y="161.39999999999998" width="115" height="153.60000000000002" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="602" y="146.39999999999998" font-size="25" fill="#273447" text-anchor="middle">96 升</text><text x="602" y="350" font-size="20" fill="#273447" text-anchor="middle">再减少 20% 后</text><text x="250" y="105" font-size="21" fill="#2454b8" text-anchor="start">+20 升</text><text x="475" y="105" font-size="21" fill="#c45a23" text-anchor="start">−24 升</text></g></svg>