<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="t d"><title id="t">圆锥的高从顶点垂直到达底面</title><desc id="d">直圆锥顶点A在圆形底面圆心O正上方。AO标作高h，OB为底面半径r。侧边的斜线不是高。底面圆画成椭圆是透视示意。</desc><rect width="760" height="390" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203849"><text x="30" y="38" font-size="25">高要垂直于底面</text><path d="M270 80 L130 290 A140 40 0 0 0 410 290 Z" fill="#e5eff1" stroke="#2476a8" stroke-width="2"/><ellipse cx="270" cy="290" rx="140" ry="40" fill="#d7e9ed" stroke="#2476a8" stroke-width="2"/><path d="M270 80 V290 H410" fill="none" stroke="#d05d40" stroke-width="3" stroke-dasharray="7 5"/><path d="M270 274 H286 V290" fill="none" stroke="#203849" stroke-width="2"/><circle cx="270" cy="80" r="4"/><circle cx="270" cy="290" r="4"/><text x="255" y="68" font-size="24">A</text><text x="246" y="312" font-size="22">O</text><text x="418" y="295" font-size="22">B</text><text x="285" y="190" font-size="24" fill="#d05d40">高 h</text><text x="330" y="280" font-size="22">r</text><text x="485" y="130" font-size="23">一处顶点</text><text x="485" y="179" font-size="23">一个圆形底面</text><text x="485" y="228" font-size="23">弯曲的侧面</text><text x="485" y="277" font-size="21">斜着的侧边不是高</text><text x="30" y="365" font-size="18" fill="#526171">底面圆画成椭圆，是为了表现立体；圆心到圆周才是半径。</text></g></svg>
