<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>人数和参加率，要分别比较</title><rect width="760" height="360" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">人数和参加率，要分别比较</text><text x="55" y="100" font-size="22" fill="#273447" text-anchor="start">三班：40 人</text><rect x="230" y="75" width="360" height="48" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><rect x="590" y="75" width="120" height="48" fill="white" stroke="#2454b8" stroke-width="2"/><text x="410" y="107" font-size="22" fill="#273447" text-anchor="middle">参加 30 人</text><text x="55" y="205" font-size="22" fill="#273447" text-anchor="start">四班：30 人</text><rect x="230" y="180" width="288" height="48" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><rect x="518" y="180" width="72" height="48" fill="white" stroke="#2454b8" stroke-width="2"/><text x="374" y="212" font-size="22" fill="#273447" text-anchor="middle">参加 24 人</text><text x="230" y="155" font-size="22" fill="#273447" text-anchor="start">30 ÷ 40 = 75%</text><text x="230" y="260" font-size="22" fill="#273447" text-anchor="start">24 ÷ 30 = 80%</text><text x="70" y="325" font-size="21" fill="#273447" text-anchor="start">图中每人对应相同长度；三班人数多，四班参加率高。</text></g></svg>