<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="t d"><title id="t">扇形由两条半径和一段弧围成</title><desc id="d">左边圆中四分之一扇形的两条直边从圆心O出发。右边圆中的弓形只用一条弦和弧围成，不是扇形。</desc><rect width="760" height="350" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203849"><text x="30" y="38" font-size="25">先看边是怎样围起来的</text><circle cx="200" cy="175" r="96" fill="none" stroke="#b7c3c9" stroke-width="2"/><path d="M200 175 L296 175 A96 96 0 0 0 200 79 Z" fill="#dceef7" stroke="#2476a8" stroke-width="3"/><circle cx="200" cy="175" r="4"/><text x="178" y="196" font-size="22">O</text><text x="305" y="183" font-size="22">A</text><text x="188" y="70" font-size="22">B</text><text x="216" y="202" font-size="20">半径</text><text x="167" y="135" font-size="20" text-anchor="end">半径</text><text x="280" y="110" font-size="20">弧</text><text x="200" y="310" font-size="23" text-anchor="middle">这是扇形</text><circle cx="555" cy="175" r="96" fill="none" stroke="#b7c3c9" stroke-width="2"/><path d="M638.14 127 A96 96 0 0 0 471.86 127 Z" fill="#f4dfb4" stroke="#b17c28" stroke-width="3"/><circle cx="555" cy="175" r="4"/><text x="568" y="182" font-size="22">O</text><text x="555" y="112" font-size="19" text-anchor="middle">一段弧</text><text x="555" y="154" font-size="19" text-anchor="middle">一条直线段</text><text x="555" y="310" font-size="23" text-anchor="middle">这不是扇形</text></g></svg>
