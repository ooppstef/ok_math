<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">剪角和剪边的周长</title><desc id="desc">两个6厘米乘4厘米长方形分别剪去边长2厘米的角块和顶边中块，外边周长分别20和24厘米。</desc><rect width="900" height="480" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="42" font-size="27" fill="#203849" text-anchor="start">同样剪去边长 2 厘米的正方形，边界怎样变？</text><text x="175" y="95" font-size="24" fill="#203849" text-anchor="middle">从角上剪</text><rect x="55" y="130" width="240" height="160" fill="none" stroke="#a9b3b9" stroke-dasharray="7 5" stroke-width="2"/><text x="175" y="120" font-size="19" fill="#203849" text-anchor="middle">6 厘米</text><text x="320" y="220" font-size="19" fill="#203849" text-anchor="start">4 厘米</text><text x="625" y="95" font-size="24" fill="#203849" text-anchor="middle">从边的中间剪</text><rect x="505" y="130" width="240" height="160" fill="none" stroke="#a9b3b9" stroke-dasharray="7 5" stroke-width="2"/><text x="625" y="120" font-size="19" fill="#203849" text-anchor="middle">6 厘米</text><text x="770" y="220" font-size="19" fill="#203849" text-anchor="start">4 厘米</text><path d="M55 210 L135 210 L135 130 L295 130 L295 290 L55 290 Z" fill="#e1f1e9" stroke="#297d66" stroke-width="4"/><path d="M505 130 L585 130 L585 210 L665 210 L665 130 L745 130 L745 290 L505 290 Z" fill="#e1f1e9" stroke="#297d66" stroke-width="4"/><path d="M55 210 L135 210 L135 130 M585 130 L585 210 L665 210 L665 130" fill="none" stroke="#dc732d" stroke-width="5"/><text x="95" y="178" font-size="18" fill="#203849" text-anchor="middle">剪去</text><text x="625" y="170" font-size="18" fill="#203849" text-anchor="middle">剪去</text><text x="95" y="234" font-size="17" fill="#203849" text-anchor="middle">2厘米</text><text x="625" y="235" font-size="17" fill="#203849" text-anchor="middle">2厘米</text><text x="45" y="340" font-size="22" fill="#203849" text-anchor="start">去掉两条2厘米，补回两条2厘米</text><text x="495" y="340" font-size="22" fill="#203849" text-anchor="start">去掉一条2厘米，补回三条2厘米</text><text x="45" y="382" font-size="24" fill="#203849" text-anchor="start">20－4＋4＝20（厘米）</text><text x="495" y="382" font-size="24" fill="#203849" text-anchor="start">20－2＋6＝24（厘米）</text><text x="30" y="440" font-size="22" fill="#203849" text-anchor="start">绿色外边与橙色新边合起来才是周长；灰虚线已被剪掉，不再走。</text></g></svg>
