<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img"><title>蓝绳是单位“1”，每份 5 米</title><rect width="760" height="350" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">蓝绳是单位“1”，每份 5 米</text><text x="55" y="130" font-size="22" fill="#273447" text-anchor="start">蓝绳</text><rect x="140.0" y="95" width="120.0" height="42" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><rect x="260.0" y="95" width="120.0" height="42" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><rect x="380.0" y="95" width="120.0" height="42" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><rect x="500.0" y="95" width="120.0" height="42" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="640" y="125" font-size="22" fill="#273447" text-anchor="start">20 米</text><text x="55" y="230" font-size="22" fill="#273447" text-anchor="start">红绳</text><rect x="140.0" y="195" width="120.0" height="42" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><rect x="260.0" y="195" width="120.0" height="42" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><rect x="380.0" y="195" width="120.0" height="42" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="520" y="225" font-size="22" fill="#273447" text-anchor="start">15 米</text><line x1="500" y1="185" x2="500" y2="250" stroke="#c45a23" stroke-width="2" stroke-dasharray="7 5"/><line x1="620" y1="185" x2="620" y2="250" stroke="#c45a23" stroke-width="2" stroke-dasharray="7 5"/><text x="510" y="278" font-size="21" fill="#c45a23" text-anchor="start">差 5 米</text><text x="140" y="325" font-size="23" fill="#273447" text-anchor="start">红绳占蓝绳的 3/4；相差蓝绳的 1/4。</text></g></svg>