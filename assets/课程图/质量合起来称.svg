<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">质量单位与天平平衡</title><desc id="desc">两份500克盐合1千克；平衡天平左边袋子和豆子500克，右边200克200克100克共500克。</desc><rect width="900" height="520" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="42" font-size="28" fill="#203849" text-anchor="start">合起来称：总质量是各部分质量的和</text><text x="30" y="82" font-size="23" fill="#203849" text-anchor="start">同样的盐：两份 500 克，合起来是 1 千克。</text><rect x="65" y="110" width="150" height="80" rx="8" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="140" y="143" font-size="22" fill="#203849" text-anchor="middle">盐</text><text x="140" y="174" font-size="23" fill="#203849" text-anchor="middle">500 克</text><rect x="270" y="110" width="150" height="80" rx="8" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="345" y="143" font-size="22" fill="#203849" text-anchor="middle">盐</text><text x="345" y="174" font-size="23" fill="#203849" text-anchor="middle">500 克</text><text x="240" y="162" font-size="28" fill="#203849" text-anchor="middle">＋</text><text x="505" y="158" font-size="26" fill="#203849" text-anchor="start">＝ 1000 克 ＝ 1 千克</text><text x="30" y="250" font-size="23" fill="#203849" text-anchor="start">天平平衡时，袋子和豆子与右边砝码一样重。</text><path d="M110 315 H790 M450 315 V440 M390 440 H510 M190 315 V370 M710 315 V370 M95 370 H285 M595 370 H825" fill="none" stroke="#203849" stroke-width="5"/><rect x="120" y="280" width="140" height="86" rx="8" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="190" y="315" font-size="20" fill="#203849" text-anchor="middle">袋子＋豆子</text><text x="190" y="347" font-size="24" fill="#203849" text-anchor="middle">500 克</text><rect x="600" y="290" width="70" height="76" rx="5" fill="#fbe9dc" stroke="#dc732d" stroke-width="2"/><text x="635" y="322" font-size="22" fill="#203849" text-anchor="middle">200</text><text x="635" y="350" font-size="20" fill="#203849" text-anchor="middle">克</text><rect x="675" y="290" width="70" height="76" rx="5" fill="#fbe9dc" stroke="#dc732d" stroke-width="2"/><text x="710" y="322" font-size="22" fill="#203849" text-anchor="middle">200</text><text x="710" y="350" font-size="20" fill="#203849" text-anchor="middle">克</text><rect x="750" y="290" width="70" height="76" rx="5" fill="#fbe9dc" stroke="#dc732d" stroke-width="2"/><text x="785" y="322" font-size="22" fill="#203849" text-anchor="middle">100</text><text x="785" y="350" font-size="20" fill="#203849" text-anchor="middle">克</text><text x="30" y="484" font-size="22" fill="#203849" text-anchor="start">200＋200＋100＝500（克）；单求豆子，还要减去空袋质量。</text></g></svg>
