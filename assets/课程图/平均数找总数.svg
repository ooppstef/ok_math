<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img"><title>平均数 × 份数 = 总数</title><rect width="760" height="390" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">平均数 × 份数 = 总数</text><rect x="80" y="202" width="70" height="108" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="115" y="192" font-size="23" fill="#273447" text-anchor="middle">9</text><text x="115" y="343" font-size="21" fill="#273447" text-anchor="middle">A</text><rect x="235" y="178" width="70" height="132" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="270" y="168" font-size="23" fill="#273447" text-anchor="middle">11</text><text x="270" y="343" font-size="21" fill="#273447" text-anchor="middle">B</text><rect x="390" y="154" width="70" height="156" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="425" y="144" font-size="23" fill="#273447" text-anchor="middle">13</text><text x="425" y="343" font-size="21" fill="#273447" text-anchor="middle">C</text><rect x="545" y="130" width="70" height="180" fill="#dce8ff" stroke="#2454b8" stroke-width="2"/><text x="580" y="120" font-size="23" fill="#273447" text-anchor="middle">15</text><text x="580" y="343" font-size="21" fill="#273447" text-anchor="middle">D</text><line x1="50" y1="166" x2="690" y2="166" stroke="#c45a23" stroke-width="3" stroke-dasharray="7 5"/><text x="665" y="154" font-size="20" fill="#c45a23" text-anchor="start">12</text><text x="100" y="382" font-size="22" fill="#273447" text-anchor="start">9 + 11 + 13 + 15 = 48　　48 ÷ 4 = 12</text></g></svg>