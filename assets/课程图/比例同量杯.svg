<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="title desc">
<title id="title">两种配法：2杯果汁配3杯水，复制一组得到4杯果汁配6杯水</title>
<desc id="desc">所有杯子的形状、大小和液面高度相同。橙色是果汁，蓝色是水。左边一组有两杯果汁和三杯水；右边两组各有两杯果汁和三杯水，合计四杯果汁和六杯水。两种配法的比相等。</desc>
<defs>
<g id="juice"><path d="M2 2 H34 L30 54 H6 Z" fill="#fff" stroke="#6c737a" stroke-width="2"/><path d="M4 13 H32 L29 51 H7 Z" fill="#e49b39"/><path d="M4 13 H32" stroke="#ad5e17" stroke-width="2"/></g>
<g id="water"><path d="M2 2 H34 L30 54 H6 Z" fill="#fff" stroke="#6c737a" stroke-width="2"/><path d="M4 13 H32 L29 51 H7 Z" fill="#75b8d0"/><path d="M4 13 H32" stroke="#287b98" stroke-width="2"/></g>
</defs>
<rect width="880" height="460" rx="16" fill="#fafbf8"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447">
<text x="28" y="38" font-size="25">果汁和水一起变成原来的 2 倍，配法不变</text>
<text x="28" y="74" font-size="21">每杯同样多：杯子一样大，液面一样高。</text>
<rect x="28" y="100" width="230" height="290" rx="12" fill="#fff" stroke="#c7d1d5"/>
<text x="143" y="132" text-anchor="middle" font-size="23">第一种：1 组</text>
<text x="143" y="173" text-anchor="middle" font-size="21" fill="#9a5417">果汁 2 杯</text>
<use href="#juice" x="101" y="185"/>
<use href="#juice" x="149" y="185"/>
<text x="143" y="278" text-anchor="middle" font-size="21" fill="#216c88">水 3 杯</text>
<use href="#water" x="77" y="290"/>
<use href="#water" x="125" y="290"/>
<use href="#water" x="173" y="290"/>
<text x="143" y="372" text-anchor="middle" font-size="22">2 : 3</text>
<path d="M275 242 H317 M307 232 L319 242 L307 252" fill="none" stroke="#9a651e" stroke-width="3"/>
<text x="296" y="209" text-anchor="middle" font-size="20">复制</text>
<text x="296" y="280" text-anchor="middle" font-size="20">一组</text>
<rect x="336" y="100" width="516" height="290" rx="12" fill="#fff" stroke="#c7d1d5"/>
<text x="594" y="132" text-anchor="middle" font-size="23">第二种：相同的 2 组</text>
<rect x="354" y="148" width="226" height="202" rx="9" fill="none" stroke="#b7c5c9" stroke-dasharray="6 5"/>
<rect x="608" y="148" width="226" height="202" rx="9" fill="none" stroke="#b7c5c9" stroke-dasharray="6 5"/>
<text x="467" y="173" text-anchor="middle" font-size="21" fill="#9a5417">果汁 2 杯</text>
<use href="#juice" x="425" y="185"/>
<use href="#juice" x="473" y="185"/>
<text x="721" y="173" text-anchor="middle" font-size="21" fill="#9a5417">果汁 2 杯</text>
<use href="#juice" x="679" y="185"/>
<use href="#juice" x="727" y="185"/>
<text x="467" y="278" text-anchor="middle" font-size="21" fill="#216c88">水 3 杯</text>
<use href="#water" x="401" y="290"/>
<use href="#water" x="449" y="290"/>
<use href="#water" x="497" y="290"/>
<text x="721" y="278" text-anchor="middle" font-size="21" fill="#216c88">水 3 杯</text>
<use href="#water" x="655" y="290"/>
<use href="#water" x="703" y="290"/>
<use href="#water" x="751" y="290"/>
<text x="594" y="380" text-anchor="middle" font-size="22">合计：果汁 4 杯，水 6 杯</text>
<text x="440" y="430" text-anchor="middle" font-size="26" fill="#216c88">2 : 3 = (2 × 2) : (3 × 2) = 4 : 6</text>
</g></svg>
