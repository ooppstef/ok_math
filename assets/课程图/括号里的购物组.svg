<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">括号改变重复的一组</title><desc id="desc">上排三支5元笔和一本4元本子共19元，下排三包每包一笔一本共27元。</desc><rect width="900" height="480" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="42" font-size="28" fill="#203849" text-anchor="start">买 3 包时，括号圈住每包里的东西</text><text x="30" y="85" font-size="24" fill="#203849" text-anchor="start">3×5＋4：3 支笔，另加 1 本本子</text><rect x="40" y="110" width="120" height="75" rx="8" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="100" y="140" font-size="22" fill="#203849" text-anchor="middle">笔</text><text x="100" y="170" font-size="22" fill="#203849" text-anchor="middle">5 元</text><rect x="185" y="110" width="120" height="75" rx="8" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="245" y="140" font-size="22" fill="#203849" text-anchor="middle">笔</text><text x="245" y="170" font-size="22" fill="#203849" text-anchor="middle">5 元</text><rect x="330" y="110" width="120" height="75" rx="8" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><text x="390" y="140" font-size="22" fill="#203849" text-anchor="middle">笔</text><text x="390" y="170" font-size="22" fill="#203849" text-anchor="middle">5 元</text><text x="490" y="159" font-size="30" fill="#203849" text-anchor="middle">＋</text><rect x="535" y="110" width="120" height="75" rx="8" fill="#fbe9dc" stroke="#dc732d" stroke-width="2"/><text x="595" y="140" font-size="22" fill="#203849" text-anchor="middle">本子</text><text x="595" y="170" font-size="22" fill="#203849" text-anchor="middle">4 元</text><text x="700" y="155" font-size="24" fill="#203849" text-anchor="start">共 19 元</text><text x="30" y="245" font-size="24" fill="#203849" text-anchor="start">3×(5＋4)：把“一支笔＋一本本子”当作一包，买 3 包</text><rect x="35" y="270" width="260" height="125" rx="8" fill="#ffffff" stroke="#7d919d" stroke-width="2"/><rect x="50" y="286" width="105" height="90" rx="8" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><rect x="175" y="286" width="105" height="90" rx="8" fill="#fbe9dc" stroke="#dc732d" stroke-width="2"/><text x="102" y="324" font-size="22" fill="#203849" text-anchor="middle">笔</text><text x="102" y="356" font-size="22" fill="#203849" text-anchor="middle">5 元</text><text x="227" y="324" font-size="22" fill="#203849" text-anchor="middle">本子</text><text x="227" y="356" font-size="22" fill="#203849" text-anchor="middle">4 元</text><rect x="320" y="270" width="260" height="125" rx="8" fill="#ffffff" stroke="#7d919d" stroke-width="2"/><rect x="335" y="286" width="105" height="90" rx="8" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><rect x="460" y="286" width="105" height="90" rx="8" fill="#fbe9dc" stroke="#dc732d" stroke-width="2"/><text x="387" y="324" font-size="22" fill="#203849" text-anchor="middle">笔</text><text x="387" y="356" font-size="22" fill="#203849" text-anchor="middle">5 元</text><text x="512" y="324" font-size="22" fill="#203849" text-anchor="middle">本子</text><text x="512" y="356" font-size="22" fill="#203849" text-anchor="middle">4 元</text><rect x="605" y="270" width="260" height="125" rx="8" fill="#ffffff" stroke="#7d919d" stroke-width="2"/><rect x="620" y="286" width="105" height="90" rx="8" fill="#e1f1e9" stroke="#297d66" stroke-width="2"/><rect x="745" y="286" width="105" height="90" rx="8" fill="#fbe9dc" stroke="#dc732d" stroke-width="2"/><text x="672" y="324" font-size="22" fill="#203849" text-anchor="middle">笔</text><text x="672" y="356" font-size="22" fill="#203849" text-anchor="middle">5 元</text><text x="797" y="324" font-size="22" fill="#203849" text-anchor="middle">本子</text><text x="797" y="356" font-size="22" fill="#203849" text-anchor="middle">4 元</text><text x="30" y="445" font-size="24" fill="#203849" text-anchor="start">每包 9 元，共 27 元。下面比上面多买了 2 本本子。</text></g></svg>
