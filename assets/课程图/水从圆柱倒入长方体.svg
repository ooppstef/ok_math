<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 475" role="img"><title>圆柱水桶的62.8立方分米水倒入底面积20平方分米的长方体容器</title><rect width="880" height="475" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="28" y="40" font-size="25" fill="#273447" text-anchor="start">全部水倒过去，水的体积保持不变</text><text x="155" y="90" font-size="23" fill="#273447" text-anchor="middle">圆柱形水桶</text><rect x="85" y="135" width="140" height="175" fill="#c9e7f0"/><ellipse cx="155" cy="310" rx="70" ry="18" fill="#c9e7f0" stroke="#287b98" stroke-width="2"/><path d="M85 135 V310 M225 135 V310" stroke="#287b98" stroke-width="2"/><ellipse cx="155" cy="135" rx="70" ry="18" fill="#75b8d0" stroke="#287b98" stroke-width="2"/><path d="M85 135 H225" stroke="#ad5e17" stroke-width="2"/><text x="155" y="115" font-size="20" fill="#273447" text-anchor="middle">内直径 4 分米</text><text x="239" y="230" font-size="20" fill="#273447" text-anchor="start">内高</text><text x="239" y="258" font-size="20" fill="#273447" text-anchor="start">5 分米</text><text x="155" y="224" font-size="21" fill="#273447" text-anchor="middle">装满水</text><text x="155" y="263" font-size="23" fill="#216c88" text-anchor="middle">62.8 dm³</text><path d="M340 230 H472 M460 218 L474 230 L460 242" fill="none" stroke="#9a651e" stroke-width="3"/><text x="407" y="192" font-size="21" fill="#273447" text-anchor="middle">水全部倒入</text><text x="407" y="276" font-size="20" fill="#273447" text-anchor="middle">不洒出、不溢出</text><text x="647" y="90" font-size="23" fill="#273447" text-anchor="middle">长方体容器（侧面）</text><rect x="560" y="200.1" width="175" height="109.9" fill="#c9e7f0"/><path d="M560 135 V310 H735 V135" fill="none" stroke="#287b98" stroke-width="3"/><path d="M560 200.1 H735" stroke="#287b98" stroke-width="2"/><text x="647" y="248" font-size="21" fill="#273447" text-anchor="middle">水仍有</text><text x="647" y="281" font-size="23" fill="#216c88" text-anchor="middle">62.8 dm³</text><text x="752" y="235" font-size="21" fill="#273447" text-anchor="start">水深</text><text x="752" y="265" font-size="21" fill="#273447" text-anchor="start">3.14 分米</text><text x="647" y="350" font-size="21" fill="#273447" text-anchor="middle">内底面：5 × 4 = 20 dm²</text><text x="40" y="407" font-size="23" fill="#273447" text-anchor="start">先求水的体积：3.14 × 2² × 5 = 62.8 dm³</text><text x="40" y="447" font-size="23" fill="#273447" text-anchor="start">再求水深：62.8 ÷ 20 = 3.14 dm</text></g></svg>
