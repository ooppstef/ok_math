<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img"><title>里程表：后一次读数 − 前一次读数</title><rect width="760" height="340" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">里程表：后一次读数 − 前一次读数</text><rect x="60" y="90" width="160" height="65" fill="white" stroke="#2454b8" stroke-width="2"/><text x="140" y="132" font-size="32" fill="#273447" text-anchor="middle">328</text><text x="140" y="190" font-size="20" fill="#273447" text-anchor="middle">出发</text><rect x="290" y="90" width="160" height="65" fill="white" stroke="#2454b8" stroke-width="2"/><text x="370" y="132" font-size="32" fill="#273447" text-anchor="middle">396</text><text x="370" y="190" font-size="20" fill="#273447" text-anchor="middle">到公园</text><rect x="520" y="90" width="160" height="65" fill="white" stroke="#2454b8" stroke-width="2"/><text x="600" y="132" font-size="32" fill="#273447" text-anchor="middle">475</text><text x="600" y="190" font-size="20" fill="#273447" text-anchor="middle">回到学校</text><line x1="225" y1="120" x2="280" y2="120" stroke="#2454b8" stroke-width="3"/><polygon points="280,120 270.0950818741206,124.78462087522354 270.0950818741206,115.21537912477646" fill="#2454b8" stroke="#2454b8" stroke-width="2"/><line x1="455" y1="120" x2="510" y2="120" stroke="#2454b8" stroke-width="3"/><polygon points="510,120 500.0950818741206,124.78462087522354 500.0950818741206,115.21537912477646" fill="#2454b8" stroke="#2454b8" stroke-width="2"/><text x="60" y="250" font-size="22" fill="#273447" text-anchor="start">第一段：396 − 328 = 68 千米</text><text x="60" y="290" font-size="22" fill="#273447" text-anchor="start">第二段：475 − 396 = 79 千米；全程 147 千米</text></g></svg>