<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img"><title>小数点对齐，相同数位对齐</title><rect width="760" height="390" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">小数点对齐，相同数位对齐</text><text x="250" y="90" font-size="21" fill="#273447" text-anchor="middle">个位</text><text x="420" y="90" font-size="21" fill="#273447" text-anchor="middle">十分位</text><text x="590" y="90" font-size="21" fill="#273447" text-anchor="middle">百分位</text><line x1="165" y1="105" x2="165" y2="320" stroke="#d8dedf" stroke-width="2"/><line x1="335" y1="105" x2="335" y2="320" stroke="#d8dedf" stroke-width="2"/><line x1="505" y1="105" x2="505" y2="320" stroke="#d8dedf" stroke-width="2"/><line x1="675" y1="105" x2="675" y2="320" stroke="#d8dedf" stroke-width="2"/><text x="250" y="150" font-size="34" fill="#273447" text-anchor="middle">3</text><text x="335" y="150" font-size="34" fill="#273447" text-anchor="middle">.</text><text x="420" y="150" font-size="34" fill="#273447" text-anchor="middle">7</text><text x="590" y="150" font-size="34" fill="#273447" text-anchor="middle">5</text><text x="250" y="220" font-size="34" fill="#273447" text-anchor="middle">2</text><text x="335" y="220" font-size="34" fill="#273447" text-anchor="middle">.</text><text x="420" y="220" font-size="34" fill="#273447" text-anchor="middle">6</text><text x="590" y="220" font-size="34" fill="#273447" text-anchor="middle">0</text><text x="250" y="290" font-size="34" fill="#273447" text-anchor="middle">6</text><text x="335" y="290" font-size="34" fill="#273447" text-anchor="middle">.</text><text x="420" y="290" font-size="34" fill="#273447" text-anchor="middle">3</text><text x="590" y="290" font-size="34" fill="#273447" text-anchor="middle">5</text><text x="125" y="220" font-size="30" fill="#273447" text-anchor="start">+</text><line x1="125" y1="240" x2="675" y2="240" stroke="#273447" stroke-width="2"/><text x="120" y="360" font-size="21" fill="#273447" text-anchor="start">2.6 = 2.60；十分位 7 + 6 = 13，要向个位进 1。</text></g></svg>