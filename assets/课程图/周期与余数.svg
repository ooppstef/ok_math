<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">红黄蓝的周期和余数</title><desc id="desc">先画第1至7个并按每3个圈成轮，33整轮是99个，100是下一轮第1个红色。</desc><rect width="900" height="480" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="42" font-size="28" fill="#203849" text-anchor="start">红、黄、蓝：每 3 个是一轮</text><rect x="35" y="78" width="250" height="135" rx="8" fill="#ffffff" stroke="#9aadb6" stroke-width="2"/><circle cx="80" cy="120" r="18" fill="#c8524d"/><text x="80" y="166" font-size="20" fill="#203849" text-anchor="middle">红</text><text x="80" y="194" font-size="18" fill="#203849" text-anchor="middle">1</text><circle cx="160" cy="120" r="18" fill="#dbb742"/><text x="160" y="166" font-size="20" fill="#203849" text-anchor="middle">黄</text><text x="160" y="194" font-size="18" fill="#203849" text-anchor="middle">2</text><circle cx="240" cy="120" r="18" fill="#4e7fa7"/><text x="240" y="166" font-size="20" fill="#203849" text-anchor="middle">蓝</text><text x="240" y="194" font-size="18" fill="#203849" text-anchor="middle">3</text><text x="160" y="247" font-size="22" fill="#203849" text-anchor="middle">第 1 轮</text><rect x="320" y="78" width="250" height="135" rx="8" fill="#ffffff" stroke="#9aadb6" stroke-width="2"/><circle cx="365" cy="120" r="18" fill="#c8524d"/><text x="365" y="166" font-size="20" fill="#203849" text-anchor="middle">红</text><text x="365" y="194" font-size="18" fill="#203849" text-anchor="middle">4</text><circle cx="445" cy="120" r="18" fill="#dbb742"/><text x="445" y="166" font-size="20" fill="#203849" text-anchor="middle">黄</text><text x="445" y="194" font-size="18" fill="#203849" text-anchor="middle">5</text><circle cx="525" cy="120" r="18" fill="#4e7fa7"/><text x="525" y="166" font-size="20" fill="#203849" text-anchor="middle">蓝</text><text x="525" y="194" font-size="18" fill="#203849" text-anchor="middle">6</text><text x="445" y="247" font-size="22" fill="#203849" text-anchor="middle">第 2 轮</text><circle cx="650" cy="120" r="18" fill="#c8524d"/><text x="650" y="166" font-size="20" fill="#203849" text-anchor="middle">红</text><text x="650" y="194" font-size="18" fill="#203849" text-anchor="middle">7</text><text x="710" y="135" font-size="30" fill="#203849" text-anchor="start">……</text><text x="605" y="247" font-size="21" fill="#203849" text-anchor="start">新一轮第 1 个</text><rect x="35" y="290" width="535" height="74" rx="8" fill="#e8f0f4" stroke="#9aadb6" stroke-width="2"/><text x="302" y="336" font-size="24" fill="#203849" text-anchor="middle">33 个完整周期：3×33＝99 个</text><text x="615" y="337" font-size="30" fill="#203849" text-anchor="middle">＋</text><circle cx="690" cy="326" r="18" fill="#c8524d"/><text x="745" y="335" font-size="22" fill="#203849" text-anchor="start">第 100 个</text><text x="35" y="405" font-size="24" fill="#203849" text-anchor="start">100÷3＝33 余 1 → 第 100 个是新一轮的红色。</text><text x="35" y="452" font-size="22" fill="#203849" text-anchor="start">余数是 0 时，落在整轮最后一个（蓝色），没有“第 0 个”。</text></g></svg>
