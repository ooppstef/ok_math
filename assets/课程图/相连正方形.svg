<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>相连的正方形，每多一个只添三根</title><rect width="760" height="360" rx="16" fill="#fafbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273447"><text x="30" y="38" font-size="24" fill="#273447" text-anchor="start">相连的正方形，每多一个只添三根</text><line x1="35" y1="130" x2="70" y2="130" stroke="#c45a23" stroke-width="5"/><line x1="35" y1="165" x2="70" y2="165" stroke="#c45a23" stroke-width="5"/><line x1="35" y1="130" x2="35" y2="165" stroke="#2454b8" stroke-width="5"/><line x1="70" y1="130" x2="70" y2="165" stroke="#2454b8" stroke-width="5"/><text x="35" y="215" font-size="20" fill="#273447" text-anchor="start">1 个：4 根</text><line x1="212" y1="130" x2="247" y2="130" stroke="#c45a23" stroke-width="5"/><line x1="212" y1="165" x2="247" y2="165" stroke="#c45a23" stroke-width="5"/><line x1="212" y1="130" x2="212" y2="165" stroke="#2454b8" stroke-width="5"/><line x1="247" y1="130" x2="282" y2="130" stroke="#c45a23" stroke-width="5"/><line x1="247" y1="165" x2="282" y2="165" stroke="#c45a23" stroke-width="5"/><line x1="247" y1="130" x2="247" y2="165" stroke="#2454b8" stroke-width="5"/><line x1="282" y1="130" x2="282" y2="165" stroke="#2454b8" stroke-width="5"/><text x="212" y="215" font-size="20" fill="#273447" text-anchor="start">2 个：7 根</text><line x1="389" y1="130" x2="424" y2="130" stroke="#c45a23" stroke-width="5"/><line x1="389" y1="165" x2="424" y2="165" stroke="#c45a23" stroke-width="5"/><line x1="389" y1="130" x2="389" y2="165" stroke="#2454b8" stroke-width="5"/><line x1="424" y1="130" x2="459" y2="130" stroke="#c45a23" stroke-width="5"/><line x1="424" y1="165" x2="459" y2="165" stroke="#c45a23" stroke-width="5"/><line x1="424" y1="130" x2="424" y2="165" stroke="#2454b8" stroke-width="5"/><line x1="459" y1="130" x2="494" y2="130" stroke="#c45a23" stroke-width="5"/><line x1="459" y1="165" x2="494" y2="165" stroke="#c45a23" stroke-width="5"/><line x1="459" y1="130" x2="459" y2="165" stroke="#2454b8" stroke-width="5"/><line x1="494" y1="130" x2="494" y2="165" stroke="#2454b8" stroke-width="5"/><text x="389" y="215" font-size="20" fill="#273447" text-anchor="start">3 个：10 根</text><line x1="566" y1="130" x2="601" y2="130" stroke="#c45a23" stroke-width="5"/><line x1="566" y1="165" x2="601" y2="165" stroke="#c45a23" stroke-width="5"/><line x1="566" y1="130" x2="566" y2="165" stroke="#2454b8" stroke-width="5"/><line x1="601" y1="130" x2="636" y2="130" stroke="#c45a23" stroke-width="5"/><line x1="601" y1="165" x2="636" y2="165" stroke="#c45a23" stroke-width="5"/><line x1="601" y1="130" x2="601" y2="165" stroke="#2454b8" stroke-width="5"/><line x1="636" y1="130" x2="671" y2="130" stroke="#c45a23" stroke-width="5"/><line x1="636" y1="165" x2="671" y2="165" stroke="#c45a23" stroke-width="5"/><line x1="636" y1="130" x2="636" y2="165" stroke="#2454b8" stroke-width="5"/><line x1="671" y1="130" x2="706" y2="130" stroke="#c45a23" stroke-width="5"/><line x1="671" y1="165" x2="706" y2="165" stroke="#c45a23" stroke-width="5"/><line x1="671" y1="130" x2="671" y2="165" stroke="#2454b8" stroke-width="5"/><line x1="706" y1="130" x2="706" y2="165" stroke="#2454b8" stroke-width="5"/><text x="566" y="215" font-size="20" fill="#273447" text-anchor="start">4 个：13 根</text><text x="60" y="285" font-size="23" fill="#273447" text-anchor="start">第一次摆 4 根，后面每添一个，共用一条边。</text><text x="60" y="325" font-size="23" fill="#273447" text-anchor="start">6 个正方形：4 + 5 × 3 = 19 根</text></g></svg>