<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">变长，也要变窄，乘积才不变</title><desc id="desc">同单位方格的3乘4、4乘3、6乘2矩形各12格，面积固定。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">变长，也要变窄，乘积才不变</text><text x="40" y="85" font-size="22" fill="#203849" text-anchor="start">固定面积 12 平方厘米</text><rect x="40" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="68" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="96" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="40" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="68" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="96" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="40" y="176" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="68" y="176" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="96" y="176" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="40" y="204" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="68" y="204" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="96" y="204" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="40" y="285" font-size="24" fill="#203849" text-anchor="start">3×4 = 12</text><rect x="270" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="298" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="326" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="354" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="270" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="298" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="326" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="354" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="270" y="176" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="298" y="176" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="326" y="176" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="354" y="176" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="270" y="285" font-size="24" fill="#203849" text-anchor="start">4×3 = 12</text><rect x="500" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="528" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="556" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="584" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="612" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="640" y="120" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="500" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="528" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="556" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="584" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="612" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="640" y="148" width="28" height="28" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="500" y="285" font-size="24" fill="#203849" text-anchor="start">6×2 = 12</text><text x="40" y="340" font-size="22" fill="#203849" text-anchor="start">长从 3 到 6 变 2 倍，宽从 4 到 2 变一半。</text></g></svg>