<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">一份多大变了，份数仍是 3</title><desc id="desc">上面600分3份每份200，下面6分3份每份2，条形按份数示意，单位量同步缩小。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">一份多大变了，份数仍是 3</text><text x="40" y="85" font-size="22" fill="#203849" text-anchor="start">总量与每份量一起除以 100</text><rect x="70" y="120" width="150" height="55" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="145" y="156" font-size="26" fill="#2476a8" text-anchor="middle">200</text><rect x="240" y="120" width="150" height="55" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="315" y="156" font-size="26" fill="#2476a8" text-anchor="middle">200</text><rect x="410" y="120" width="150" height="55" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="485" y="156" font-size="26" fill="#2476a8" text-anchor="middle">200</text><text x="600" y="156" font-size="23" fill="#203849" text-anchor="middle">共 600</text><rect x="70" y="220" width="150" height="55" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="145" y="256" font-size="26" fill="#2476a8" text-anchor="middle">2</text><rect x="240" y="220" width="150" height="55" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="315" y="256" font-size="26" fill="#2476a8" text-anchor="middle">2</text><rect x="410" y="220" width="150" height="55" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="485" y="256" font-size="26" fill="#2476a8" text-anchor="middle">2</text><text x="600" y="256" font-size="23" fill="#203849" text-anchor="middle">共 6</text><text x="70" y="335" font-size="24" fill="#203849" text-anchor="start">600÷200 = 6÷2 = 3；两次都是 3 份。</text><text x="70" y="370" font-size="18" fill="#526171">按份数示意；两条等长，不表示总量相等。</text></g></svg>