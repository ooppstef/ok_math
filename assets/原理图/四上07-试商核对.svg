<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img"><title>96 ÷ 32：先试商，再按 32 一份核对</title><rect width="900" height="390" fill="#ffffff"/><text x="30" y="40" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#223449" text-anchor="start">96 ÷ 32：先试商，再按 32 一份核对</text><rect x="90" y="130" width="220" height="90" fill="#e1edf8" stroke="#2563a6" stroke-width="2"/><text x="200" y="185" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2563a6" text-anchor="middle">32</text><rect x="310" y="130" width="220" height="90" fill="#e1edf8" stroke="#2563a6" stroke-width="2"/><text x="420" y="185" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2563a6" text-anchor="middle">32</text><rect x="530" y="130" width="220" height="90" fill="#e1edf8" stroke="#2563a6" stroke-width="2"/><text x="640" y="185" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" fill="#2563a6" text-anchor="middle">32</text><line x1="90" y1="100" x2="750" y2="100" stroke="#223449" stroke-width="2"/><line x1="90" y1="90" x2="90" y2="110" stroke="#223449" stroke-width="2"/><line x1="750" y1="90" x2="750" y2="110" stroke="#223449" stroke-width="2"/><text x="420" y="85" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="middle">总数 96</text><text x="100" y="275" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#223449" text-anchor="start">32×3＝96：正好分成 3 份，没有剩余。</text><text x="100" y="340" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#223449" text-anchor="start">把 32 先看成 30 只是估计；核对要用原来的 32。</text></svg>