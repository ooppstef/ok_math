<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img"><title>12 cm × 18 cm：用相同正方形铺满</title><rect width="900" height="440" fill="#ffffff"/><text x="30" y="40" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#223449" text-anchor="start">12 cm × 18 cm：用相同正方形铺满</text><rect x="90" y="120" width="120" height="120" fill="#e2f0ec" stroke="#168577" stroke-width="2"/><text x="150" y="188" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#168577" text-anchor="middle">6×6</text><rect x="210" y="120" width="120" height="120" fill="#e2f0ec" stroke="#168577" stroke-width="2"/><text x="270" y="188" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#168577" text-anchor="middle">6×6</text><rect x="330" y="120" width="120" height="120" fill="#e2f0ec" stroke="#168577" stroke-width="2"/><text x="390" y="188" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#168577" text-anchor="middle">6×6</text><rect x="90" y="240" width="120" height="120" fill="#e2f0ec" stroke="#168577" stroke-width="2"/><text x="150" y="308" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#168577" text-anchor="middle">6×6</text><rect x="210" y="240" width="120" height="120" fill="#e2f0ec" stroke="#168577" stroke-width="2"/><text x="270" y="308" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#168577" text-anchor="middle">6×6</text><rect x="330" y="240" width="120" height="120" fill="#e2f0ec" stroke="#168577" stroke-width="2"/><text x="390" y="308" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#168577" text-anchor="middle">6×6</text><text x="270" y="100" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#223449" text-anchor="middle">18 cm＝3×6 cm</text><text x="35" y="245" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="start">12</text><text x="25" y="275" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#223449" text-anchor="start">cm</text><text x="520" y="175" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="start">正方形边长 6 cm</text><text x="520" y="235" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="start">18÷6＝3（个）</text><text x="520" y="290" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="start">12÷6＝2（个）</text><text x="520" y="345" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="start">共 3×2＝6（个）</text><text x="90" y="410" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="start">6 同时整除 12 和 18，也是它们最大的公因数。</text></svg>