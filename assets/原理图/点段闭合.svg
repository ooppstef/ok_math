<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">接起来的是端点，四段仍然都在</title><desc id="desc">直线四个间隔五个点，首尾合并后成四段闭环四个点。每段长度相等，闭合前后四段总长不变。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">接起来的是端点，四段仍然都在</text><text x="40" y="90" font-size="22" fill="#203849" text-anchor="start">路没围起来：4 段、5 个点</text><line x1="70" y1="135" x2="650" y2="135" stroke="#203849" stroke-width="2"/><circle cx="70" cy="135" r="8" fill="#2476a8"/><circle cx="215" cy="135" r="8" fill="#2476a8"/><circle cx="360" cy="135" r="8" fill="#2476a8"/><circle cx="505" cy="135" r="8" fill="#2476a8"/><circle cx="650" cy="135" r="8" fill="#2476a8"/><text x="40" y="190" font-size="22" fill="#203849" text-anchor="start">首尾两个点合在一起：4 段、4 个位置</text><rect x="245" y="205" width="145" height="145" fill="none" stroke="#203849" stroke-width="1.5"/><circle cx="245" cy="205" r="8" fill="#2476a8"/><circle cx="390" cy="205" r="8" fill="#2476a8"/><circle cx="390" cy="350" r="8" fill="#2476a8"/><circle cx="245" cy="350" r="8" fill="#2476a8"/><text x="470" y="292" font-size="23" fill="#203849" text-anchor="start">封闭一圈</text></g></svg>