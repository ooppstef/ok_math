<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">比较角，要看转过多少</title><desc id="desc">两个角的两条边画出相同长度，分别张开40度和80度，弧线标转角。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">比较角，要看转过多少</text><text x="40" y="85" font-size="22" fill="#203849" text-anchor="start">顶点不动，开口从 40° 变到 80°</text><circle cx="135" cy="260" r="5" fill="#203849"/><line x1="135" y1="260" x2="300" y2="260" stroke="#203849" stroke-width="3"/><line x1="135" y1="260" x2="261.3973331146314" y2="153.94004440172102" stroke="#2476a8" stroke-width="4"/><path d="M 185 260 A 50 50 0 0 0 173.3022221559489 227.86061951567302" fill="none" stroke="#2476a8" stroke-width="3"/><text x="200" y="230" font-size="23" fill="#2476a8" text-anchor="start">40°</text><circle cx="450" cy="260" r="5" fill="#203849"/><line x1="450" y1="260" x2="615" y2="260" stroke="#203849" stroke-width="3"/><line x1="450" y1="260" x2="478.6519493150435" y2="97.50672075298567" stroke="#dc732d" stroke-width="4"/><path d="M 500 260 A 50 50 0 0 0 458.6824088833465 210.7596123493896" fill="none" stroke="#dc732d" stroke-width="3"/><text x="515" y="230" font-size="23" fill="#dc732d" text-anchor="start">80°</text><text x="40" y="340" font-size="23" fill="#203849" text-anchor="start">延长边不改变开口；转动一条边才改变角。</text></g></svg>