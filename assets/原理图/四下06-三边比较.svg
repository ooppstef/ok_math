<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img"><title>短的两边相加：大于、等于、小于最长边</title><rect width="900" height="490" fill="#ffffff"/><text x="30" y="40" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#223449" text-anchor="start">短的两边相加：大于、等于、小于最长边</text><text x="60" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="start">3、4、5：能围成</text><line x1="80" y1="280" x2="240" y2="280" stroke="#2563a6" stroke-width="4"/><line x1="80" y1="280" x2="80" y2="160" stroke="#168577" stroke-width="4"/><line x1="80" y1="160" x2="240" y2="280" stroke="#c64d50" stroke-width="4"/><text x="150" y="310" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">4</text><text x="50" y="225" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">3</text><text x="175" y="210" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">5</text><text x="50" y="370" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="start">3＋4＞5</text><text x="350" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="start">3、4、7：拉直</text><line x1="350" y1="180" x2="440" y2="180" stroke="#168577" stroke-width="7"/><line x1="440" y1="180" x2="560" y2="180" stroke="#c64d50" stroke-width="7"/><line x1="350" y1="230" x2="560" y2="230" stroke="#2563a6" stroke-width="5"/><text x="390" y="165" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">3</text><text x="495" y="165" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">4</text><text x="450" y="265" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">7</text><text x="350" y="370" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="start">3＋4＝7</text><text x="640" y="90" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="start">3、4、8：够不到</text><line x1="640" y1="180" x2="730" y2="180" stroke="#168577" stroke-width="7"/><line x1="730" y1="180" x2="850" y2="180" stroke="#c64d50" stroke-width="7"/><line x1="640" y1="230" x2="880" y2="230" stroke="#2563a6" stroke-width="5"/><line x1="850" y1="170" x2="880" y2="170" stroke="#b86d18" stroke-width="3" stroke-dasharray="8 6"/><text x="680" y="165" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">3</text><text x="785" y="165" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">4</text><text x="750" y="265" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">8</text><text x="640" y="370" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="start">3＋4＜8</text><text x="50" y="445" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">长度单位相同；中、右图把两条短边接直，才能看出够不够长。</text></svg>