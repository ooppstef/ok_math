<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">图上的两段 x，怎样写进方程</title><desc id="desc">乙为x，甲为同长x加3，总量17，去掉3后两段x共14。线段为关系示意。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">图上的两段 x，怎样写进方程</text><text x="40" y="100" font-size="22" fill="#203849" text-anchor="start">乙</text><rect x="100" y="70" width="210" height="45" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><text x="205" y="102" font-size="28" fill="#fff" text-anchor="middle">x</text><text x="40" y="190" font-size="22" fill="#203849" text-anchor="start">甲</text><rect x="100" y="160" width="210" height="45" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><text x="205" y="192" font-size="28" fill="#fff" text-anchor="middle">x</text><rect x="310" y="160" width="90" height="45" fill="#f9dfad" stroke="#203849" stroke-width="1.5"/><text x="355" y="192" font-size="27" fill="#203849" text-anchor="middle">3</text><text x="450" y="170" font-size="27" fill="#203849" text-anchor="start">合计 17</text><text x="100" y="275" font-size="22" fill="#203849" text-anchor="start">两段相同的 x，再加多出的 3</text><text x="100" y="330" font-size="28" fill="#2476a8" text-anchor="start">x + (x+3) = 17</text></g></svg>