<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">长×宽，数的是铺满的单位小格</title><desc id="desc">6列5行共30个1平方厘米的小正方形。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">长×宽，数的是铺满的单位小格</text><rect x="45" y="90" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="81" y="90" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="117" y="90" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="153" y="90" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="189" y="90" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="225" y="90" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="45" y="126" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="81" y="126" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="117" y="126" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="153" y="126" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="189" y="126" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="225" y="126" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="45" y="162" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="81" y="162" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="117" y="162" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="153" y="162" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="189" y="162" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="225" y="162" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="45" y="198" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="81" y="198" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="117" y="198" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="153" y="198" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="189" y="198" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="225" y="198" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="45" y="234" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="81" y="234" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="117" y="234" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="153" y="234" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="189" y="234" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="225" y="234" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="153" y="80" font-size="22" fill="#203849" text-anchor="middle">6 厘米</text><text x="275" y="180" font-size="22" fill="#203849" text-anchor="start">5 行，每行 6 格</text><text x="275" y="222" font-size="22" fill="#203849" text-anchor="start">每格 1 平方厘米</text><text x="275" y="264" font-size="23" fill="#203849" text-anchor="start">6×5 = 30 平方厘米</text><text x="45" y="335" font-size="23" fill="#203849" text-anchor="start">一排一排数，所有小格各算一次。</text></g></svg>