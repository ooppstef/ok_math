<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">除以 2，来自两块完全一样的三角形</title><desc id="desc">蓝三角形底6高4；副本绕斜边中点转180度，两份拼成底6高4平行四边形，总面积24。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">除以 2，来自两块完全一样的三角形</text><polygon points="40,255 220,255 100,135" fill="#dceef7" stroke="#203849" stroke-width="2"/><text x="90" y="295" font-size="22" fill="#203849" text-anchor="start">底 6，高 4</text><line x1="270" y1="210" x2="330" y2="210" stroke="#dc732d" stroke-width="3"/><path d="M 321.0 204.0 L 330 210 L 321.0 216.0" fill="none" stroke="#dc732d" stroke-width="3"/><polygon points="370,255 550,255 430,135" fill="#dceef7" stroke="#203849" stroke-width="2"/><polygon points="550,255 610,135 430,135" fill="#f9dfad" stroke="#203849" stroke-width="2"/><line x1="430" y1="135" x2="430" y2="255" stroke="#89959b" stroke-width="2" stroke-dasharray="6 5"/><text x="390" y="295" font-size="21" fill="#203849" text-anchor="start">两份合起来：6×4 = 24</text><text x="40" y="350" font-size="24" fill="#203849" text-anchor="start">原三角形面积 = 24÷2 = 12 平方厘米</text></g></svg>