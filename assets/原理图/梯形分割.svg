<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">同一条对角线，分出两个三角形</title><desc id="desc">梯形上底3下底5高4，对角线划分出底3与底5的三角形，两高均4，面积6加10等于16。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">同一条对角线，分出两个三角形</text><polygon points="65,270 265,270 225,110 105,110" fill="#dceef7" stroke="#203849" stroke-width="2"/><line x1="65" y1="270" x2="225" y2="110" stroke="#dc732d" stroke-width="3"/><text x="165" y="95" font-size="22" fill="#203849" text-anchor="middle">上底 3</text><text x="165" y="305" font-size="22" fill="#203849" text-anchor="middle">下底 5</text><line x1="105" y1="110" x2="105" y2="270" stroke="#89959b" stroke-width="2" stroke-dasharray="6 5"/><text x="35" y="200" font-size="22" fill="#203849" text-anchor="start">4</text><text x="330" y="140" font-size="23" fill="#203849" text-anchor="start">两块三角形的高都是 4</text><text x="330" y="200" font-size="25" fill="#2476a8" text-anchor="start">3×4÷2 = 6</text><text x="330" y="250" font-size="25" fill="#dc732d" text-anchor="start">5×4÷2 = 10</text><text x="330" y="315" font-size="21" fill="#203849" text-anchor="start">合计：(3+5)×4÷2 = 16</text></g></svg>