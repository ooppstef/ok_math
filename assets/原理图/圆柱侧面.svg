<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">摊平后，圆周变成了长方形的边</title><desc id="desc">圆柱侧面展开成长方形，长为底面周长C，宽为高h，原上下圆周对应橙色两边。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">摊平后，圆周变成了长方形的边</text><text x="40" y="85" font-size="22" fill="#203849" text-anchor="start">同一张长方形侧面展开纸</text><rect x="70" y="120" width="480" height="150" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="310" y="310" font-size="23" fill="#203849" text-anchor="middle">绕底面一圈：底面周长 C</text><text x="590" y="200" font-size="24" fill="#203849" text-anchor="start">高 h</text><line x1="70" y1="120" x2="550" y2="120" stroke="#dc732d" stroke-width="5"/><line x1="70" y1="270" x2="550" y2="270" stroke="#dc732d" stroke-width="5"/><text x="70" y="355" font-size="23" fill="#203849" text-anchor="start">侧面积 C×h；再按需要加一个或两个底面。</text></g></svg>