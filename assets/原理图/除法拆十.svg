<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">余下的十，拆成一再分</title><desc id="desc">56中先分3个十，剩2个十拆成20个一，与6个一合成26，每人再分8个一，剩2。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">余下的十，拆成一再分</text><text x="55" y="85" font-size="22" fill="#203849" text-anchor="start">56 平均分成 3 份</text><rect x="35" y="115" width="205" height="155" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="50" y="135" width="35" height="105" fill="#e1f1e9" stroke="#203849" stroke-width="1.5"/><text x="67" y="193" font-size="20" fill="#297d66" text-anchor="middle">10</text><circle cx="118" cy="158" r="9" fill="#dc732d"/><circle cx="146" cy="158" r="9" fill="#dc732d"/><circle cx="174" cy="158" r="9" fill="#dc732d"/><circle cx="202" cy="158" r="9" fill="#dc732d"/><circle cx="118" cy="202" r="9" fill="#dc732d"/><circle cx="146" cy="202" r="9" fill="#dc732d"/><circle cx="174" cy="202" r="9" fill="#dc732d"/><circle cx="202" cy="202" r="9" fill="#dc732d"/><text x="135" y="300" font-size="21" fill="#203849" text-anchor="middle">10 + 8 = 18</text><rect x="260" y="115" width="205" height="155" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="275" y="135" width="35" height="105" fill="#e1f1e9" stroke="#203849" stroke-width="1.5"/><text x="292" y="193" font-size="20" fill="#297d66" text-anchor="middle">10</text><circle cx="343" cy="158" r="9" fill="#dc732d"/><circle cx="371" cy="158" r="9" fill="#dc732d"/><circle cx="399" cy="158" r="9" fill="#dc732d"/><circle cx="427" cy="158" r="9" fill="#dc732d"/><circle cx="343" cy="202" r="9" fill="#dc732d"/><circle cx="371" cy="202" r="9" fill="#dc732d"/><circle cx="399" cy="202" r="9" fill="#dc732d"/><circle cx="427" cy="202" r="9" fill="#dc732d"/><text x="360" y="300" font-size="21" fill="#203849" text-anchor="middle">10 + 8 = 18</text><rect x="485" y="115" width="205" height="155" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="500" y="135" width="35" height="105" fill="#e1f1e9" stroke="#203849" stroke-width="1.5"/><text x="517" y="193" font-size="20" fill="#297d66" text-anchor="middle">10</text><circle cx="568" cy="158" r="9" fill="#dc732d"/><circle cx="596" cy="158" r="9" fill="#dc732d"/><circle cx="624" cy="158" r="9" fill="#dc732d"/><circle cx="652" cy="158" r="9" fill="#dc732d"/><circle cx="568" cy="202" r="9" fill="#dc732d"/><circle cx="596" cy="202" r="9" fill="#dc732d"/><circle cx="624" cy="202" r="9" fill="#dc732d"/><circle cx="652" cy="202" r="9" fill="#dc732d"/><text x="585" y="300" font-size="21" fill="#203849" text-anchor="middle">10 + 8 = 18</text><text x="35" y="345" font-size="22" fill="#203849" text-anchor="start">分掉 18×3 = 54；剩下</text><circle cx="335" cy="338" r="9" fill="#dc732d"/><circle cx="365" cy="338" r="9" fill="#dc732d"/><text x="395" y="345" font-size="21" fill="#203849" text-anchor="start">2 个一</text></g></svg>