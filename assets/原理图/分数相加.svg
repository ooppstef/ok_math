<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">先换成同样长的小段，再接起来</title><desc id="desc">三个同长条分六格。半个对应3格，三分之一个对应2格，合起来5格。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">先换成同样长的小段，再接起来</text><rect x="40" y="90" width="65" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="105" y="90" width="65" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="170" y="90" width="65" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="235" y="90" width="65" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="300" y="90" width="65" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="365" y="90" width="65" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="460" y="118" font-size="25" fill="#203849" text-anchor="start">1/2 = 3/6</text><rect x="40" y="175" width="65" height="42" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="105" y="175" width="65" height="42" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="170" y="175" width="65" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="235" y="175" width="65" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="300" y="175" width="65" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="365" y="175" width="65" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="460" y="203" font-size="25" fill="#203849" text-anchor="start">1/3 = 2/6</text><rect x="40" y="260" width="65" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="105" y="260" width="65" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="170" y="260" width="65" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="235" y="260" width="65" height="42" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="300" y="260" width="65" height="42" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="365" y="260" width="65" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="460" y="288" font-size="25" fill="#203849" text-anchor="start">和 = 5/6</text><text x="40" y="350" font-size="23" fill="#203849" text-anchor="start">每格都是同一个单位长度的 1/6。</text></g></svg>