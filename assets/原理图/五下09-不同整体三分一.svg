<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img"><title>同样取 1/3：先认清整个单位“1”</title><rect width="900" height="440" fill="#ffffff"/><text x="30" y="40" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#223449" text-anchor="start">同样取 1/3：先认清整个单位“1”</text><text x="40" y="95" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="start">12 颗糖，平均分成 3 份</text><rect x="380" y="80" width="130" height="100" fill="#d9eee9" stroke="#168577" stroke-width="2"/><circle cx="415" cy="115" r="10" fill="#168577"/><circle cx="475" cy="115" r="10" fill="#168577"/><circle cx="415" cy="150" r="10" fill="#168577"/><circle cx="475" cy="150" r="10" fill="#168577"/><rect x="530" y="80" width="130" height="100" fill="#f4f6f8" stroke="#9aabba" stroke-width="2"/><circle cx="565" cy="115" r="10" fill="#738798"/><circle cx="625" cy="115" r="10" fill="#738798"/><circle cx="565" cy="150" r="10" fill="#738798"/><circle cx="625" cy="150" r="10" fill="#738798"/><rect x="680" y="80" width="130" height="100" fill="#f4f6f8" stroke="#9aabba" stroke-width="2"/><circle cx="715" cy="115" r="10" fill="#738798"/><circle cx="775" cy="115" r="10" fill="#738798"/><circle cx="715" cy="150" r="10" fill="#738798"/><circle cx="775" cy="150" r="10" fill="#738798"/><text x="40" y="145" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#168577" text-anchor="start">取 1 份：4 颗</text><text x="40" y="260" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="start">6 颗糖，平均分成 3 份</text><rect x="380" y="245" width="130" height="100" fill="#d9eee9" stroke="#168577" stroke-width="2"/><circle cx="415" cy="280" r="10" fill="#168577"/><circle cx="475" cy="280" r="10" fill="#168577"/><rect x="530" y="245" width="130" height="100" fill="#f4f6f8" stroke="#9aabba" stroke-width="2"/><circle cx="565" cy="280" r="10" fill="#738798"/><circle cx="625" cy="280" r="10" fill="#738798"/><rect x="680" y="245" width="130" height="100" fill="#f4f6f8" stroke="#9aabba" stroke-width="2"/><circle cx="715" cy="280" r="10" fill="#738798"/><circle cx="775" cy="280" r="10" fill="#738798"/><text x="40" y="310" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#168577" text-anchor="start">取 1 份：2 颗</text><text x="50" y="410" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="start">绿色都占全部的 1/3；整体不同，取到的糖数不同。</text></svg>