<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">剪下一块，平移到另一边</title><desc id="desc">坐标按每厘米30像素，原底6高3错位2；左侧三角形平移6后拼成6乘3长方形，面积18。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">剪下一块，平移到另一边</text><text x="45" y="85" font-size="22" fill="#203849" text-anchor="start">原图：底 6，高 3</text><polygon points="45,240 225,240 285,150 105,150" fill="#dceef7" stroke="#203849" stroke-width="2"/><polygon points="45,240 105,240 105,150" fill="#f9dfad" stroke="#203849" stroke-width="2"/><line x1="105" y1="150" x2="105" y2="240" stroke="#dc732d" stroke-width="2" stroke-dasharray="6 5"/><rect x="105" y="228" width="12" height="12" fill="none" stroke="#203849" stroke-width="1.5"/><line x1="305" y1="200" x2="365" y2="200" stroke="#dc732d" stroke-width="3"/><path d="M 356.0 194.0 L 365 200 L 356.0 206.0" fill="none" stroke="#dc732d" stroke-width="3"/><rect x="405" y="150" width="180" height="90" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><polygon points="525,240 585,240 585,150" fill="#f9dfad" stroke="#203849" stroke-width="2"/><text x="405" y="280" font-size="23" fill="#203849" text-anchor="start">长 6，高 3</text><text x="45" y="340" font-size="22" fill="#203849" text-anchor="start">橙色块只平移 6；面积始终是 6×3 = 18。</text></g></svg>