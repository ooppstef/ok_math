<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img"><title>先算两种商品各花多少，再合起来</title><rect width="900" height="440" fill="#ffffff"/><text x="30" y="40" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#223449" text-anchor="start">先算两种商品各花多少，再合起来</text><rect x="70" y="90" width="300" height="65" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="220.0" y="130.5" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#2563a6" text-anchor="middle">3 支笔，每支 5 元</text><rect x="530" y="90" width="300" height="65" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="680.0" y="130.5" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#2563a6" text-anchor="middle">2 本本子，每本 3 元</text><line x1="220" y1="160" x2="220" y2="205" stroke="#2563a6" stroke-width="3"/><line x1="220" y1="205" x2="214.78041359066523" y2="194.19463477176788" stroke="#2563a6" stroke-width="3"/><line x1="220" y1="205" x2="225.21958640933477" y2="194.19463477176788" stroke="#2563a6" stroke-width="3"/><line x1="680" y1="160" x2="680" y2="205" stroke="#2563a6" stroke-width="3"/><line x1="680" y1="205" x2="674.7804135906653" y2="194.19463477176788" stroke="#2563a6" stroke-width="3"/><line x1="680" y1="205" x2="685.2195864093347" y2="194.19463477176788" stroke="#2563a6" stroke-width="3"/><rect x="100" y="215" width="240" height="65" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="220.0" y="255.5" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#2563a6" text-anchor="middle">3×5＝15（元）</text><rect x="560" y="215" width="240" height="65" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="680.0" y="255.5" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#2563a6" text-anchor="middle">2×3＝6（元）</text><line x1="340" y1="250" x2="400" y2="330" stroke="#2563a6" stroke-width="3"/><line x1="400" y1="330" x2="389.3411117355929" y2="324