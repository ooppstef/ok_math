<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img"><title>绕 O 顺时针转 90°：每个点都转相同角度</title><rect width="900" height="510" fill="#ffffff"/><text x="30" y="40" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#223449" text-anchor="start">绕 O 顺时针转 90°：每个点都转相同角度</text><line x1="100" y1="90" x2="100" y2="440" stroke="#dce5ec" stroke-width="1"/><line x1="150" y1="90" x2="150" y2="440" stroke="#dce5ec" stroke-width="1"/><line x1="200" y1="90" x2="200" y2="440" stroke="#dce5ec" stroke-width="1"/><line x1="250" y1="90" x2="250" y2="440" stroke="#dce5ec" stroke-width="1"/><line x1="300" y1="90" x2="300" y2="440" stroke="#dce5ec" stroke-width="1"/><line x1="350" y1="90" x2="350" y2="440" stroke="#dce5ec" stroke-width="1"/><line x1="400" y1="90" x2="400" y2="440" stroke="#dce5ec" stroke-width="1"/><line x1="450" y1="90" x2="450" y2="440" stroke="#dce5ec" stroke-width="1"/><line x1="500" y1="90" x2="500" y2="440" stroke="#dce5ec" stroke-width="1"/><line x1="100" y1="90" x2="500" y2="90" stroke="#dce5ec" stroke-width="1"/><line x1="100" y1="140" x2="500" y2="140" stroke="#dce5ec" stroke-width="1"/><line x1="100" y1="190" x2="500" y2="190" stroke="#dce5ec" stroke-width="1"/><line x1="100" y1="240" x2="500" y2="240" stroke="#dce5ec" stroke-width="1"/><line x1="100" y1="290" x2="500" y2="290" stroke="#dce5ec" stroke-width="1"/><line x1="100" y1="340" x2="500" y2="340" stroke="#dce5ec" stroke-width="1"/><line x1="100" y1="390" x2="500" y2="390" stroke="#dce5ec" stroke-width="1"/><line x1="100" y1="440" x2="500" y2="440" stroke="#dce5ec" stroke-width="1"/><line x1="250" y1="240" x2="400" y2="240" stroke="#2563a6" stroke-width="4"/><line x1="400" y1="240" x2="250" y2="140" stroke="#2563a6" stroke-width="4"/><line x1="250" y1="140" x2="250" y2="240" stroke="#2563a6" stroke-width="4"/><line x1="250" y1="240" x2="250" y2="390" stroke="#b86d18" stroke-width="4"/><line x1="250" y1="390" x2="350" y2="240" stroke="#b86d18" stroke-width="4"/><line x1="350" y1="240" x2="250" y2="240" stroke="#b86d18" stroke-width="4"/><circle cx="250" cy="240" r="5" fill="#223449"/><text x="225" y="265" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="start">O</text><circle cx="400" cy="240" r="5" fill="#2563a6"/><text x="405" y="228" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#2563a6" text-anchor="start">A</text><circle cx="250" cy="140" r="5" fill="#2563a6"/><text x="225" y="132" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#2563a6" text-anchor="start">B</text><circle cx="250" cy="390" r="5" fill="#b86d18"/><text x="220" y="415" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#b86d18" text-anchor="start">A′</text><circle cx="350" cy="240" r="5" fill="#b86d18"/><text x="350" y="270" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#b86d18" text-anchor="start">B′</text><text x="550" y="160" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#2563a6" text-anchor="start">蓝色：旋转前</text><text x="550" y="210" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#b86d18" text-anchor="start">橙色：旋转后</text><text x="550" y="280" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="start">A：右 3 格 → 下 3 格</text><text x="550" y="330" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="start">B：上 2 格 → 右 2 格</text><text x="80" y="480" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">每一格同样大。O 不动，OA 和 OA′ 都长 3 格，OB 和 OB′ 都长 2 格。</text></svg>