<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">每一层 L 形，恰好多一个奇数</title><desc id="desc">5乘5点阵按每次右列下行的L形分色，每层分别1、3、5、7、9个，总25。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">每一层 L 形，恰好多一个奇数</text><circle cx="80" cy="105" r="12" fill="#2476a8"/><circle cx="120" cy="105" r="12" fill="#dc732d"/><circle cx="160" cy="105" r="12" fill="#297d66"/><circle cx="200" cy="105" r="12" fill="#9168a0"/><circle cx="240" cy="105" r="12" fill="#bd9a2f"/><circle cx="80" cy="145" r="12" fill="#dc732d"/><circle cx="120" cy="145" r="12" fill="#dc732d"/><circle cx="160" cy="145" r="12" fill="#297d66"/><circle cx="200" cy="145" r="12" fill="#9168a0"/><circle cx="240" cy="145" r="12" fill="#bd9a2f"/><circle cx="80" cy="185" r="12" fill="#297d66"/><circle cx="120" cy="185" r="12" fill="#297d66"/><circle cx="160" cy="185" r="12" fill="#297d66"/><circle cx="200" cy="185" r="12" fill="#9168a0"/><circle cx="240" cy="185" r="12" fill="#bd9a2f"/><circle cx="80" cy="225" r="12" fill="#9168a0"/><circle cx="120" cy="225" r="12" fill="#9168a0"/><circle cx="160" cy="225" r="12" fill="#9168a0"/><circle cx="200" cy="225" r="12" fill="#9168a0"/><circle cx="240" cy="225" r="12" fill="#bd9a2f"/><circle cx="80" cy="265" r="12" fill="#bd9a2f"/><circle cx="120" cy="265" r="12" fill="#bd9a2f"/><circle cx="160" cy="265" r="12" fill="#bd9a2f"/><circle cx="200" cy="265" r="12" fill="#bd9a2f"/><circle cx="240" cy="265" r="12" fill="#bd9a2f"/><circle cx="360" cy="95" r="9" fill="#2476a8"/><text x="385" y="103" font-size="23" fill="#203849" text-anchor="start">第 1 层：1 个点</text><circle cx="360" cy="140" r="9" fill="#dc732d"/><text x="385" y="148" font-size="23" fill="#203849" text-anchor="start">第 2 层：3 个点</text><circle cx="360" cy="185" r="9" fill="#297d66"/><text x="385" y="193" font-size="23" fill="#203849" text-anchor="start">第 3 层：5 个点</text><circle cx="360" cy="230" r="9" fill="#9168a0"/><text x="385" y="238" font-size="23" fill="#203849" text-anchor="start">第 4 层：7 个点</text><circle cx="360" cy="275" r="9" fill="#bd9a2f"/><text x="385" y="283" font-size="23" fill="#203849" text-anchor="start">第 5 层：9 个点</text><text x="45" y="345" font-size="27" fill="#203849" text-anchor="start">1 + 3 + 5 + 7 + 9 = 5×5 = 25</text></g></svg>