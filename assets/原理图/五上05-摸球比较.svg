ont-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="white" text-anchor="middle">蓝</text><text x="670" y="295" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="middle">2 红 2 蓝</text><text x="60" y="345" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">红球机会较大，蓝球也可能摸到。</text><text x="500" y="345" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">两种颜色的机会相同。</text></svg>