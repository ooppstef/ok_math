<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">四分之一，先看是不是平均分</title><desc id="desc">两个同大正方形，一个分四条，一个分两行两列；各取一份，两份面积均占原正方形四分之一。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">四分之一，先看是不是平均分</text><text x="40" y="85" font-size="22" fill="#203849" text-anchor="start">同样大的纸，都平均分成 4 份</text><rect x="65" y="120" width="160" height="40" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="65" y="160" width="160" height="40" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="65" y="200" width="160" height="40" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="65" y="240" width="160" height="40" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="415" y="120" width="80" height="80" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="495" y="120" width="80" height="80" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="415" y="200" width="80" height="80" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="495" y="200" width="80" height="80" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="145" y="320" font-size="27" fill="#2476a8" text-anchor="middle">1/4</text><text x="495" y="320" font-size="27" fill="#2476a8" text-anchor="middle">1/4</text><text x="40" y="360" font-size="23" fill="#203849" text-anchor="start">形状不同；每份面积相等，才叫平均分。</text></g></svg>