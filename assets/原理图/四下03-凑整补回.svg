<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img"><title>198＋47：多加的 2 要减回来</title><rect width="900" height="380" fill="#ffffff"/><text x="30" y="40" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#223449" text-anchor="start">198＋47：多加的 2 要减回来</text><rect x="40" y="100" width="230" height="70" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="155.0" y="143.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#2563a6" text-anchor="middle">198＋47</text><line x1="285" y1="135" x2="365" y2="135" stroke="#2563a6" stroke-width="3"/><line x1="365" y1="135" x2="354.1946347717679" y2="140.21958640933477" stroke="#2563a6" stroke-width="3"/><line x1="365" y1="135" x2="354.1946347717679" y2="129.78041359066523" stroke="#2563a6" stroke-width="3"/><text x="325" y="95" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#b86d18" text-anchor="middle">先多加 2</text><rect x="380" y="100" width="230" height="70" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="495.0" y="143.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#2563a6" text-anchor="middle">200＋47＝247</text><line x1="620" y1="135" x2="725" y2="135" stroke="#2563a6" stroke-width="3"/><line x1="725" y1="135" x2="714.1946347717678" y2="140.21958640933477" stroke="#2563a6" stroke-width="3"/><line x1="725" y1="135" x2="714.1946347717678" y2="129.78041359066523" stroke="#2563a6" stroke-width="3"/><text x="675" y="95" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#168577" text-anchor="middle">再减 2</text><rect x="740" y="100" width="120" height="70" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="800.0" y="143.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#2563a6" text-anchor="middle">245</text><text x="80" y="265" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="27" fill="#223449" text