<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">固定边长以后，哪些位置还能动</title><desc id="desc">3-4-5三角形的顶点由到两底端距离限制；四边形示意虚线对角线还能变化。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">固定边长以后，哪些位置还能动</text><text x="40" y="85" font-size="22" fill="#203849" text-anchor="start">固定底边 AB = 5；另两边 3、4</text><polygon points="80,270 280,270 152,174" fill="#dceef7" stroke="#203849" stroke-width="2"/><text x="155" y="310" font-size="23" fill="#203849" text-anchor="start">5</text><text x="82" y="205" font-size="23" fill="#203849" text-anchor="start">3</text><text x="235" y="200" font-size="23" fill="#203849" text-anchor="start">4</text><polygon points="420,270 600,270 650,150 470,150" fill="#f9dfad" stroke="#203849" stroke-width="2"/><line x1="420" y1="270" x2="650" y2="150" stroke="#dc732d" stroke-width="3" stroke-dasharray="6 5"/><text x="400" y="310" font-size="20" fill="#203849" text-anchor="start">固定四边，斜撑还没固定</text><text x="40" y="355" font-size="22" fill="#203849" text-anchor="start">三角形的顶点要同时满足到 A、B 的距离。</text></g></svg>