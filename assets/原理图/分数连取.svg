<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">一部分的几分之几</title><desc id="desc">整块分3列4行共12格，先取左2列8格，再取其中上3行6格，所得是原整块1/2。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">一部分的几分之几</text><rect x="45" y="100" width="52" height="52" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="97" y="100" width="52" height="52" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="149" y="100" width="52" height="52" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="45" y="152" width="52" height="52" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="97" y="152" width="52" height="52" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="149" y="152" width="52" height="52" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="45" y="204" width="52" height="52" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="97" y="204" width="52" height="52" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="149" y="204" width="52" height="52" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="45" y="256" width="52" height="52" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="97" y="256" width="52" height="52" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="149" y="256" width="52" height="52" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="280" y="125" font-size="23" fill="#203849" text-anchor="start">先取 2/3：左边 2 列</text><text x="280" y="175" font-size="23" fill="#203849" text-anchor="start">再取这部分的 3/4</text><text x="280" y="225" font-size="23" fill="#203849" text-anchor="start">留下 2×3 = 6 小格</text><text x="280" y="280" font-size="23" fill="#203849" text-anchor="start">整块有 3×4 = 12 小格</text><text x="45" y="350" font-size="27" fill="#2476a8" text-anchor="start">2/3×3/4 = 6/12 = 1/2</text></g></svg>