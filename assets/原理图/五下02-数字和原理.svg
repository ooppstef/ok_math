<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img"><title>375：先拿走能分成三根组的部分</title><rect width="900" height="470" fill="#ffffff"/><text x="30" y="40" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#223449" text-anchor="start">375：先拿走能分成三根组的部分</text><rect x="40" y="90" width="240" height="65" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="160.0" y="130.5" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#2563a6" text-anchor="middle">300＝3 个百</text><text x="160" y="200" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="middle">拿走 3×99＝297</text><line x1="160" y1="220" x2="160" y2="270" stroke="#2563a6" stroke-width="3"/><line x1="160" y1="270" x2="154.78041359066523" y2="259.1946347717679" stroke="#2563a6" stroke-width="3"/><line x1="160" y1="270" x2="165.21958640933477" y2="259.1946347717679" stroke="#2563a6" stroke-width="3"/><rect x="75" y="280" width="170" height="55" fill="#edf4fa" stroke="#168577" stroke-width="2"/><text x="160.0" y="315.5" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#168577" text-anchor="middle">留下 3</text><rect x="330" y="90" width="240" height="65" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="450.0" y="130.5" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#2563a6" text-anchor="middle">70＝7 个十</text><text x="450" y="200" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="middle">拿走 7×9＝63</text><line x1="450" y1="220" x2="450" y2="270" stroke="#2563a6" stroke-width="3"/><line x1="450" y1="270" x2="444.78041359066526" y2="259.1946347717679" stroke="#2563a6" stroke-width="3"/><line x1="450" y1="270" x2="455.21958640933474" y2="259.1946347717679" stroke="#2563a6" stroke-width="3"/><rect x="365" y="280" width="170" height="55" fill="#edf4fa" stroke="#168577" stroke-width="2"/><text x="450.0" y="315.5" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#168577" text-anchor="middle">留下 7</text><rect x="620" y="90" width="240" height="65" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="740.0" y="130.5" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#2563a6" text-anchor="middle">5＝5 个一</text><text x="740" y="200" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="middle">先不拿走</text><line x1="740" y1="220" x2="740" y2="270" stroke="#2563a6" stroke-width="3"/><line x1="740" y1="270" x2="734.7804135906653" y2="259.1946347717679" stroke="#2563a6" stroke-width="3"/><line x1="740" y1="270" x2="745.2195864093347" y2="259.1946347717679" stroke="#2563a6" stroke-width="3"/><rect x="655" y="280" width="170" height="55" fill="#edf4fa" stroke="#168577" stroke-width="2"/><text x="740.0" y="315.5" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#168577" text-anchor="middle">留下 5</text><text x="85" y="395" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#223449" text-anchor="start">剩下 3＋7＋5＝15，也能每 3 根分一组。</text><text x="85" y="440" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="start">375＝297＋63＋15；三部分都能被 3 整除。</text></svg>