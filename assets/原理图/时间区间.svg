<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">跨过整点，分两段数</title><desc id="desc">时间轴比例每分钟13像素，2:40到3:00二十分，3:00到3:25二十五分，总四十五分。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">跨过整点，分两段数</text><text x="40" y="85" font-size="22" fill="#203849" text-anchor="start">从 2:40 到 3:25</text><line x1="70" y1="180" x2="655" y2="180" stroke="#203849" stroke-width="2"/><line x1="70" y1="170" x2="70" y2="190" stroke="#203849" stroke-width="2"/><text x="70" y="225" font-size="23" fill="#203849" text-anchor="middle">2:40</text><line x1="330" y1="170" x2="330" y2="190" stroke="#203849" stroke-width="2"/><text x="330" y="225" font-size="23" fill="#203849" text-anchor="middle">3:00</text><line x1="655" y1="170" x2="655" y2="190" stroke="#203849" stroke-width="2"/><text x="655" y="225" font-size="23" fill="#203849" text-anchor="middle">3:25</text><rect x="70" y="130" width="260" height="35" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="330" y="130" width="325" height="35" fill="#f9dfad" stroke="#203849" stroke-width="1.5"/><text x="200" y="115" font-size="24" fill="#2476a8" text-anchor="middle">20 分</text><text x="492" y="115" font-size="24" fill="#dc732d" text-anchor="middle">25 分</text><text x="70" y="310" font-size="28" fill="#203849" text-anchor="start">20 + 25 = 45 分钟</text><text x="70" y="350" font-size="21" fill="#203849" text-anchor="start">刻度表示时刻；两点之间的长度表示时长。</text></g></svg>