crosoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="middle">左</text><text x="255.0" y="362.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#223449" text-anchor="middle">4×3＝12</text><rect x="450" y="280" width="90" height="120" fill="#fff0d7" stroke="#2563a6" stroke-width="2"/><text x="495.0" y="332.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="middle">右</text><text x="495.0" y="362.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#223449" text-anchor="middle">4×3＝12</text><text x="590" y="150" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#223449" text-anchor="start">上、下：20×2＝40</text><text x="590" y="215" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#223449" text-anchor="start">前、后：15×2＝30</text><text x="590" y="280" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#223449" text-anchor="start">左、右：12×2＝24</text><text x="590" y="365" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="start">共 40＋30＋24</text><text x="590" y="410" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="start">＝94 cm²</text><text x="75" y="530" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">图内算式的面积单位都是 cm²。展开时没有增加或减少任何一个面。</text></svg>