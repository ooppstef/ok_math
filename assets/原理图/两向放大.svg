<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">两条边都翻倍，面积变成 4 倍</title><desc id="desc">3乘2长方形放大为6乘4，可分成4块原来的3乘2长方形。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">两条边都翻倍，面积变成 4 倍</text><rect x="45" y="110" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="81" y="110" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="117" y="110" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="45" y="146" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="81" y="146" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="117" y="146" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="45" y="305" font-size="25" fill="#203849" text-anchor="start">3×2 = 6</text><rect x="250" y="110" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="286" y="110" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="322" y="110" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="358" y="110" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="394" y="110" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="430" y="110" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="250" y="146" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="286" y="146" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="322" y="146" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="358" y="146" width="36" height="36" fill="#dceef7" strok