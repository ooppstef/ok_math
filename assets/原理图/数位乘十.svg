<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">乘 10，数字换到更大的单位</title><desc id="desc">固定十位个位十分位百分位，3.25的数字各左移一列，成为32.5。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">乘 10，数字换到更大的单位</text><text x="40" y="85" font-size="22" fill="#203849" text-anchor="start">固定数位表，看数字换到哪一列</text><text x="185" y="135" font-size="21" fill="#203849" text-anchor="middle">十位</text><rect x="140" y="155" width="90" height="55" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="140" y="250" width="90" height="55" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="310" y="135" font-size="21" fill="#203849" text-anchor="middle">个位</text><rect x="265" y="155" width="90" height="55" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="265" y="250" width="90" height="55" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="435" y="135" font-size="21" fill="#203849" text-anchor="middle">十分位</text><rect x="390" y="155" width="90" height="55" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="390" y="250" width="90" height="55" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="560" y="135" font-size="21" fill="#203849" text-anchor="middle">百分位</text><rect x="515" y="155" width="90" height="55" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="515" y="250" width="90" height="55" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="310" y="192" font-size="29" fill="#2476a8" text-anchor="middle">3</text><text x="435" y="192" font-size="29" fill="#2476a8" text-anchor="middle">2</text><text x="560" y="192" font-size="29" fill="#2476a8" text-anchor="middle">5</text><text x="185" y="287" font-size="29" fill="#dc732d" text-anchor="middle">3</text><text x="310" y="287" font-size="29" fill="#dc732d" text-anchor="middle">2</text><text x="435" y="287" font-size="29" fill="#dc732d" text-anchor="middle">5</text><text x="30" y="190" font-size="24" fill="#203849" text-anchor="start">3.25</text><text x="30" y="287" font-size="24" fill="#203849" text-anchor="start">×10</text><text x="140" y="350" font-size="22" fill="#203849" text-anchor="start">每个数字都到了大 10 倍的单位上：32.5</text></g></svg>