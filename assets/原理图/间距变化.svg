<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">算相遇和追及，先看间距</title><desc id="desc">上图比例每米2像素，初距300，双方60与40相向，剩200。下图初距100，后者100前者80同向，剩80。</desc><rect width="720" height="400" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">算相遇和追及，先看间距</text><text x="40" y="85" font-size="22" fill="#203849" text-anchor="start">相向：原来相距 300 米</text><line x1="60" y1="130" x2="660" y2="130" stroke="#203849" stroke-width="2"/><line x1="60" y1="130" x2="180" y2="130" stroke="#2476a8" stroke-width="3"/><path d="M 171.0 124.0 L 180 130 L 171.0 136.0" fill="none" stroke="#2476a8" stroke-width="3"/><line x1="660" y1="130" x2="580" y2="130" stroke="#dc732d" stroke-width="3"/><path d="M 589.0 136.0 L 580 130 L 589.0 124.0" fill="none" stroke="#dc732d" stroke-width="3"/><circle cx="180" cy="130" r="8" fill="#2476a8"/><circle cx="580" cy="130" r="8" fill="#dc732d"/><text x="65" y="175" font-size="21" fill="#2476a8" text-anchor="start">甲走 60 米</text><text x="535" y="175" font-size="21" fill="#dc732d" text-anchor="start">乙走 40 米</text><text x="240" y="125" font-size="22" fill="#203849" text-anchor="start">剩 200 米</text><text x="40" y="230" font-size="22" fill="#203849" text-anchor="start">同向追赶：原来相距 100 米</text><line x1="60" y1="270" x2="660" y2="270" stroke="#203849" stroke-width="2"/><circle cx="140" cy="270" r="8" fill="#2476a8"/><circle cx="340" cy="270" r="8" fill="#dc732d"/><line x1="140" y1="270" x2="340" y2="270" stroke="#2476a8" stroke-width="3"/><path d="M 331.0 264.0 L 340 270 L 331.0 276.0" fill="none" stroke="#2476a8" stroke-width="3"/><line x1="340" y1="270" x2="500" y2="270" stroke="#dc732d" stroke-width="3"/><path d="M 491.0 264.0 L 500 270 L 491.0 276.0" fill="none" stroke="#dc732d" stroke-width="3"/><text x="100" y="315" font-size="21" fill="#2476a8" text-anchor="start">后者走 100 米</text><text x="450" y="315" font-size="21" fill="#dc732d" text-anchor="start">前者走 80 米</text><text x="40" y="360" font-size="22" fill="#203849" text-anchor="start">每分钟：相向少 100 米；追赶只少 20 米。</text></g></svg>