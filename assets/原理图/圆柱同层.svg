<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">底面积相同的圆片，一层层叠起</title><desc id="desc">圆柱俯视圆半径r，侧视矩形高h，虚线示意等高层；侧视的矩形不是展开后的侧面。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">底面积相同的圆片，一层层叠起</text><text x="45" y="90" font-size="22" fill="#203849" text-anchor="start">从正上方看</text><circle cx="155" cy="190" r="75" fill="#dceef7"/><line x1="155" y1="190" x2="230" y2="190" stroke="#2476a8" stroke-width="3"/><text x="185" y="180" font-size="23" fill="#203849" text-anchor="start">r</text><text x="45" y="305" font-size="24" fill="#203849" text-anchor="start">底面积 πr²</text><text x="360" y="90" font-size="22" fill="#203849" text-anchor="start">从侧面看</text><rect x="430" y="120" width="150" height="150" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><line x1="430" y1="150" x2="580" y2="150" stroke="#2476a8" stroke-width="1" stroke-dasharray="6 5"/><line x1="430" y1="180" x2="580" y2="180" stroke="#2476a8" stroke-width="1" stroke-dasharray="6 5"/><line x1="430" y1="210" x2="580" y2="210" stroke="#2476a8" stroke-width="1" stroke-dasharray="6 5"/><line x1="430" y1="240" x2="580" y2="240" stroke="#2476a8" stroke-width="1" stroke-dasharray="6 5"/><text x="610" y="205" font-size="27" fill="#203849" text-anchor="start">h</text><line x1="600" y1="120" x2="600" y2="270" stroke="#203849" stroke-width="2"/><text x="360" y="305" font-size="24" fill="#203849" text-anchor="start">各层底面一样大</text><text x="45" y="355" font-size="23" fill="#203849" text-anchor="start">切拼时每根扇形柱的高不变：V = πr²h</text></g></svg>