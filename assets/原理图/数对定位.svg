<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">两个条件相交，才能确定位置</title><desc id="desc">0起编号正方格，蓝点在3列4行，橙点在4列3行。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">两个条件相交，才能确定位置</text><line x1="55" y1="90" x2="55" y2="318" stroke="#ced8dc" stroke-width="1"/><line x1="55" y1="90" x2="283" y2="90" stroke="#ced8dc" stroke-width="1"/><line x1="93" y1="90" x2="93" y2="318" stroke="#ced8dc" stroke-width="1"/><line x1="55" y1="128" x2="283" y2="128" stroke="#ced8dc" stroke-width="1"/><line x1="131" y1="90" x2="131" y2="318" stroke="#ced8dc" stroke-width="1"/><line x1="55" y1="166" x2="283" y2="166" stroke="#ced8dc" stroke-width="1"/><line x1="169" y1="90" x2="169" y2="318" stroke="#ced8dc" stroke-width="1"/><line x1="55" y1="204" x2="283" y2="204" stroke="#ced8dc" stroke-width="1"/><line x1="207" y1="90" x2="207" y2="318" stroke="#ced8dc" stroke-width="1"/><line x1="55" y1="242" x2="283" y2="242" stroke="#ced8dc" stroke-width="1"/><line x1="245" y1="90" x2="245" y2="318" stroke="#ced8dc" stroke-width="1"/><line x1="55" y1="280" x2="283" y2="280" stroke="#ced8dc" stroke-width="1"/><line x1="283" y1="90" x2="283" y2="318" stroke="#ced8dc" stroke-width="1"/><line x1="55" y1="318" x2="283" y2="318" stroke="#ced8dc" stroke-width="1"/><text x="55" y="344" font-size="18" fill="#203849" text-anchor="middle">0</text><text x="35" y="324" font-size="18" fill="#203849" text-anchor="middle">0</text><text x="93" y="344" font-size="18" fill="#203849" text-anchor="middle">1</text><text x="35" y="286" font-size="18" fill="#203849" text-anchor="middle">1</text><text x="131" y="344" font-size="18" fill="#203849" text-anchor="middle">2</text><text x="35" y="248" font-size="18" fill="#203849" text-anchor="middle">2</text><text x="169" y="344" font-size="18" fill="#203849" text-anchor="middle">3</text><text x="35" y="210" font-size="18" fill="#203849" text-anchor="middle">3</text><text x="207" y="344" font-size="18" fill="#203849" text-anchor="middle">4</text><text x="35" y="172" font-size="18" fill="#203849" text-anchor="middle">4</text><text x="245" y="344" font-size="18" fill="#203849" text-anchor="middle">5</text><text x="35" y="134" font-size="18" fill="#203849" text-anchor="middle">5</text><text x="283" y="344" font-size="18" fill="#203849" text-anchor="middle">6</text><text x="35" y="96" font-size="18" fill="#203849" text-anchor="middle">6</text><circle cx="169" cy="166" r="7" fill="#2476a8"/><circle cx="207" cy="204" r="7" fill="#dc732d"/><text x="340" y="150" font-size="22" fill="#2476a8" text-anchor="start">(3,4)：第 3 列、第 4 行</text><text x="340" y="220" font-size="22" fill="#dc732d" text-anchor="start">(4,3)：第 4 列、第 3 行</text><text x="340" y="290" font-size="23" fill="#203849" text-anchor="start">顺序不同，位置不同。</text></g></svg>