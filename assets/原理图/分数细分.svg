<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">分得更细，没有多取</title><desc id="desc">同长纸带涂色一半，分别以1/2、2/4、4/8标记，切分线越来越密。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">分得更细，没有多取</text><rect x="50.0" y="100" width="240.0" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="290.0" y="100" width="240.0" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="570" y="130" font-size="28" fill="#2476a8" text-anchor="start">1/2</text><rect x="50.0" y="180" width="120.0" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="170.0" y="180" width="120.0" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="290.0" y="180" width="120.0" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="410.0" y="180" width="120.0" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="570" y="210" font-size="28" fill="#2476a8" text-anchor="start">2/4</text><rect x="50.0" y="260" width="60.0" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="110.0" y="260" width="60.0" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="170.0" y="260" width="60.0" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="230.0" y="260" width="60.0" height="42" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="290.0" y="260" width="60.0" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="350.0" y="260" width="60.0" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="410.0" y="260" width="60.0" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="470.0" y="260" width="60.0" height="42" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="570" y="290" font-size="28" fill="#2476a8" text-anchor="start">4/8</text><text x="50" y="350" font-size="23" fill="#203849" text-anchor="start">整条长度相同，涂色长度也相同。</text></g></svg>