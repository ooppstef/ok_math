<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">同样长的绳，围出的面积不同</title><desc id="desc">5乘1、4乘2、3乘3的长方形周长相同，面积分别5、8、9；格子面积相等。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">同样长的绳，围出的面积不同</text><rect x="30" y="100" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="66" y="100" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="102" y="100" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="138" y="100" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="174" y="100" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="30" y="260" font-size="24" fill="#203849" text-anchor="start">5×1 = 5</text><text x="30" y="300" font-size="20" fill="#203849" text-anchor="start">周长 12 厘米</text><rect x="270" y="100" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="306" y="100" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="342" y="100" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="378" y="100" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="270" y="136" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="306" y="136" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="342" y="136" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="378" y="136" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="270" y="260" font-size="24" fill="#203849" text-anchor="start">4×2 = 8</text><text x="270" y="300" font-size="20" fill="#203849" text-anchor="start">周长 12 厘米</text><rect x="500" y="100" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="536" y="100" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="572" y="100" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="500" y="136" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="536" y="136" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="572" y="136" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="500" y="172" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="536" y="172" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="572" y="172" width="36" height="36" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="500" y="260" font-size="24" fill="#203849" text-anchor="start">3×3 = 9</text><text x="500" y="300" font-size="20" fill="#203849" text-anchor="start">周长 12 厘米</text><text x="30" y="350" font-size="22" fill="#203849" text-anchor="start">从 5×1 到 4×2：拿走 1 格，添回 4 格。</text></g></svg>