"6"/><line x1="740" y1="120" x2="805" y2="120" stroke="#2563a6" stroke-width="6"/><line x1="740" y1="185" x2="805" y2="185" stroke="#2563a6" stroke-width="6"/><line x1="805" y1="120" x2="805" y2="185" stroke="#2563a6" stroke-width="6"/><text x="610" y="235" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#223449" text-anchor="start">n＝3：1＋3×3＝10 根</text><text x="70" y="330" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#168577" text-anchor="start">绿色：最左边固定的 1 根</text><text x="70" y="380" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#2563a6" text-anchor="start">蓝色：每多 1 格增加上边、下边、右边，共 3 根</text></svg>