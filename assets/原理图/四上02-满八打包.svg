<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img"><title>满八进一：8 个一打成 1 个八</title><rect width="900" height="400" fill="#ffffff"/><text x="30" y="40" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#223449" text-anchor="start">满八进一：8 个一打成 1 个八</text><circle cx="60" cy="140" r="13" fill="#2563a6"/><circle cx="105" cy="140" r="13" fill="#2563a6"/><circle cx="150" cy="140" r="13" fill="#2563a6"/><circle cx="195" cy="140" r="13" fill="#2563a6"/><circle cx="240" cy="140" r="13" fill="#2563a6"/><circle cx="285" cy="140" r="13" fill="#2563a6"/><circle cx="330" cy="140" r="13" fill="#2563a6"/><circle cx="375" cy="140" r="13" fill="#2563a6"/><line x1="430" y1="140" x2="530" y2="140" stroke="#2563a6" stroke-width="3"/><line x1="530" y1="140" x2="519.1946347717678" y2="145.21958640933477" stroke="#2563a6" stroke-width="3"/><line x1="530" y1="140" x2="519.1946347717678" y2="134.78041359066523" stroke="#2563a6" stroke-width="3"/><rect x="570" y="90" width="260" height="100" fill="#e0f0ea" stroke="#168577" stroke-width="2"/><circle cx="595" cy="140" r="9" fill="#168577"/><circle cx="625" cy="140" r="9" fill="#168577"/><circle cx="655" cy="140" r="9" fill="#168577"/><circle cx="685" cy="140" r="9" fill="#168577"/><circle cx="715" cy="140" r="9" fill="#168577"/><circle cx="745" cy="140" r="9" fill="#168577"/><circle cx="775" cy="140" r="9" fill="#168577"/><circle cx="805" cy="140" r="9" fill="#168577"/><text x="700" y="235" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#168577" text-anchor="middle">1 个八，0 个一</text><text x="90" y="300" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#223449" text-anchor="start">八进制写作 10₈，读“一零”；它的数量是十进制的 8。</text><text x="90" y="355" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#223449" text-anchor="start">打包前后还是这 8 个小球，改变的是数数的单位。</text></svg>