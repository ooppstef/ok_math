<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img"><title>9 个零件中，已知恰有 1 个偏轻</title><rect width="900" height="520" fill="#ffffff"/><text x="30" y="40" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#223449" text-anchor="start">9 个零件中，已知恰有 1 个偏轻</text><rect x="50" y="100" width="220" height="100" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="160" y="85" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="middle">左盘</text><circle cx="95" cy="150" r="22" fill="#2563a6"/><text x="95" y="157" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="white" text-anchor="middle">1</text><circle cx="160" cy="150" r="22" fill="#2563a6"/><text x="160" y="157" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="white" text-anchor="middle">2</text><circle cx="225" cy="150" r="22" fill="#2563a6"/><text x="225" y="157" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="white" text-anchor="middle">3</text><rect x="340" y="100" width="220" height="100" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="450" y="85" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="middle">右盘</text><circle cx="385" cy="150" r="22" fill="#2563a6"/><text x="385" y="157" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="white" text-anchor="middle">4</text><circle cx="450" cy="150" r="22" fill="#2563a6"/><text x="450" y="157" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="white" text-anchor="middle">5</text><circle cx="515" cy="150" r="22" fill="#2563a6"/><text x="515" y="157" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="white" text-anchor="middle">6</text><rect x="630" y="100" width="220" height="100" fill="#edf4fa" stroke="#2563a6" stroke-width="2"/><text x="740" y="85" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#223449" text-anchor="middle">暂不称</text><circle cx="675" cy="150" r="22" fill="#2563a6"/><text x="675" y="157" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="white" text-anchor="middle">7</text><circle cx="740" cy="150" r="22" fill="#2563a6"/><text x="740" y="157" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="white" text-anchor="middle">8</text><circle cx="805" cy="150" r="22" fill="#2563a6"/><text x="805" y="157" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="white" text-anchor="middle">9</text><text x="250" y="240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#223449" text-anchor="start">先称左盘和右盘，每边 3 个。</text><line x1="160" y1="260" x2="160" y2="300" stroke="#2563a6" stroke-width="3"/><line x1="160" y1="300" x2="154.78041359066523" y2="289.1946347717679" stroke="#2563a6" stroke-width="3"/><line x1="160" y1="300" x2="165.21958640933477" y2="289.1946347717679" stroke="#2563a6" stroke-width="3"/><rect x="50" y="320" width="220" height="70" fill="#edf4fa" stroke="#168577" stroke-width="2"/><text x="160.0" y="363.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#168577" text-anchor="middle">左边轻 → 查 1、2、3</text><line x1="450" y1="260" x2="450" y2="300" stroke="#2563a6" stroke-width="3"/><line x1="450" y1="300" x2="444.78041359066526" y2="289.1946347717679" stroke="#2563a6" stroke-width="3"/><line x1="450" y1="300" x2="455.21958640933474" y2="289.1946347717679" stroke="#2563a6" stroke-width="3"/><rect x="340" y="320" width="220" height="70" fill="#edf4fa" stroke="#168577" stroke-width="2"/><text x="450.0" y="363.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#168577" text-anchor="middle">右边轻 → 查 4、5、6</text><line x1="740" y1="260" x2="740" y2="300" stroke="#2563a6" stroke-width="3"/><line x1="740" y1="300" x2="734.7804135906653" y2="289.1946347717679" stroke="#2563a6" stroke-width="3"/><line x1="740" y1="300" x2="745.2195864093347" y2="289.1946347717679" stroke="#2563a6" stroke-width="3"/><rect x="630" y="320" width="220" height="70" fill="#edf4fa" stroke="#168577" stroke-width="2"/><text x="740.0" y="363.0" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#168577" text-anchor="middle">平衡 → 查 7、8、9</text><text x="70" y="450" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#223449" text-anchor="start">留下的 3 个，再取 2 个一边放 1 个：</text><text x="70" y="495" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#223449" text-anchor="start">不平衡就找轻的那个；平衡就找没上天平的那个。</text></svg>