<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">不满一整份，也能说是几分之几份</title><desc id="desc">相同单位整体各分15格，2/3为10格，4/5为12格。10格相当于12格一份的5/6。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">不满一整份，也能说是几分之几份</text><text x="40" y="85" font-size="22" fill="#203849" text-anchor="start">都改用 1/15 的小段来量</text><rect x="40" y="110" width="36" height="40" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="76" y="110" width="36" height="40" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="112" y="110" width="36" height="40" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="148" y="110" width="36" height="40" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="184" y="110" width="36" height="40" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="220" y="110" width="36" height="40" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="256" y="110" width="36" height="40" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="292" y="110" width="36" height="40" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="328" y="110" width="36" height="40" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="364" y="110" width="36" height="40" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="400" y="110" width="36" height="40" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="436" y="110" width="36" height="40" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="472" y="110" width="36" height="40" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="508" y="110" width="36" height="40" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="544" y="110" width="36" height="40" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="610" y="139" font-size="25" fill="#203849" text-anchor="start">2/3</text><rect x="40" y="190" width="36" height="40" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="76" y="190" width="36" height="40" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="112" y="190" width="36" height="40" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="148" y="190" width="36" height="40" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="184" y="190" width="36" height="40" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="220" y="190" width="36" height="40" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="256" y="190" width="36" height="40" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="292" y="190" width="36" height="40" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="328" y="190" width="36" height="40" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="364" y="190" width="36" height="40" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="400" y="190" width="36" height="40" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="436" y="190" width="36" height="40" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="472" y="190" width="36" height="40" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="508" y="190" width="36" height="40" fill="#fff" stroke="#203849" stroke-width="1.5"/><rect x="544" y="190" width="36" height="40" fill="#fff" stroke="#203849" stroke-width="1.5"/><text x="610" y="219" font-size="25" fill="#203849" text-anchor="start">4/5</text><text x="40" y="290" font-size="25" fill="#203849" text-anchor="start">10 小段 ÷ 12 小段 = 10/12 = 5/6</text><text x="40" y="340" font-size="22" fill="#203849" text-anchor="start">上面的长度，相当于下面一份的 5/6。</text></g></svg>