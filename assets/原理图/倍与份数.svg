<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">倍数，先认出一份</title><desc id="desc">蓝条一份、红条同样大小三份，合计四份，差两份。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">倍数，先认出一份</text><text x="40" y="85" font-size="22" fill="#203849" text-anchor="start">蓝绳 1 份；红绳 3 份，每份同样长</text><rect x="100" y="110" width="140" height="45" fill="#2476a8" stroke="#203849" stroke-width="1.5"/><rect x="100" y="205" width="140" height="45" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="240" y="205" width="140" height="45" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><rect x="380" y="205" width="140" height="45" fill="#dc732d" stroke="#203849" stroke-width="1.5"/><text x="100" y="295" font-size="25" fill="#203849" text-anchor="start">合起来是 4 份；相差 2 份。</text><text x="100" y="345" font-size="23" fill="#203849" text-anchor="start">“3 倍”与“多 3”指的不是同一段。</text></g></svg>