<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">一层有多少，叠了几层</title><desc id="desc">上图是单位立方体一层的俯视格，共3排4列12个。下图示意5层，合计60立方厘米。</desc><rect width="720" height="380" rx="16" fill="#fbfaf5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="40" font-size="26" fill="#203849" text-anchor="start">一层有多少，叠了几层</text><text x="40" y="85" font-size="22" fill="#203849" text-anchor="start">俯视一层：3 排，每排 4 个</text><rect x="55" y="115" width="38" height="38" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="93" y="115" width="38" height="38" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="131" y="115" width="38" height="38" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="169" y="115" width="38" height="38" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="55" y="153" width="38" height="38" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="93" y="153" width="38" height="38" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="131" y="153" width="38" height="38" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="169" y="153" width="38" height="38" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="55" y="191" width="38" height="38" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="93" y="191" width="38" height="38" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="131" y="191" width="38" height="38" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="169" y="191" width="38" height="38" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><text x="310" y="150" font-size="22" fill="#203849" text-anchor="start">每个小方块：1 立方厘米</text><text x="310" y="205" font-size="24" fill="#203849" text-anchor="start">一层：3×4 = 12 个</text><text x="310" y="260" font-size="24" fill="#203849" text-anchor="start">5 层：12×5 = 60 个</text><rect x="55" y="290" width="152" height="14" fill="#e1f1e9" stroke="#203849" stroke-width="1.5"/><rect x="65" y="276" width="152" height="14" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="75" y="262" width="152" height="14" fill="#e1f1e9" stroke="#203849" stroke-width="1.5"/><rect x="85" y="248" width="152" height="14" fill="#dceef7" stroke="#203849" stroke-width="1.5"/><rect x="95" y="234" width="152" height="14" fill="#e1f1e9" stroke="#203849" stroke-width="1.5"/><text x="310" y="335" font-size="25" fill="#297d66" text-anchor="start">体积 = 底面积×高</text></g></svg>